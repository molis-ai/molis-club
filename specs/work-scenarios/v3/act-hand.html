<title>Molis Work 递到手边小样</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@1,6..72,400&family=Noto+Serif+SC:wght@500;700&display=swap">
<style>
/* Layout: one desk, the work on the left and the side panel on the right, a slim dock below. A floating bar appears beside whatever is in hand; a pointer shows the single click. Two stories share this stage: code (an issue handed to Codex) and writing (a video quote placed into a draft). */
:root {
  --paper: #f5f0e6;
  --sheet: #fffcf6;
  --ink: #121826;
  --text: #33312c;
  --muted: #6f695f;
  --faint: #a39d92;
  --line: rgb(18 24 38 / 0.12);
  --red: #ee4e2b;
  --red-soft: #fbe0d8;
  --sage: #8fb69b;
  --sage-deep: #2f6b45;
  --amber: #b07a10;
  --peri: #b9c6f5;
  --cc: #e8a28c;
  --cx: #b9c6f5;
  --sel: rgb(185 198 245 / 0.8);
  --term: #151b29;
  --term-text: #e8e3d8;
  --term-muted: #8d93a3;
  --serif: 'Noto Serif SC', 'Songti SC', 'STSong', serif;
  --display: 'Newsreader', Georgia, serif;
  --sans: 'Geist', 'PingFang SC', 'Hiragino Sans GB', system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, 'PingFang SC', monospace;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  --snap: cubic-bezier(0.34, 1.4, 0.5, 1);
  --shadow: 0 18px 34px -24px rgb(40 24 10 / 0.55), 0 1px 0 rgb(18 24 38 / 0.05);
  color-scheme: light;
}
body { background: var(--paper); color: var(--text); font-family: var(--sans); }
[hidden] { display: none !important; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: clamp(16px, 3.2vw, 48px); padding-block: clamp(28px, 5vw, 64px) 48px; display: grid; gap: 22px; }
.eyebrow { margin: 0; font-size: 12px; letter-spacing: 0.08em; color: var(--muted); }
.eyebrow b { color: var(--red); font-weight: 500; }
.eyebrow a { margin-left: 8px; color: var(--muted); }
.eyebrow a.on { color: var(--ink); font-weight: 500; }
h1 { margin: 6px 0 0; font-family: var(--serif); font-weight: 700; color: var(--ink); font-size: clamp(30px, 4.6vw, 54px); line-height: 1.15; letter-spacing: -0.01em; text-wrap: balance; }

.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.steps { display: flex; flex-wrap: wrap; gap: 4px; margin: 0; padding: 0; list-style: none; }
.steps button { display: inline-flex; align-items: center; gap: 8px; font: 500 14px/1 var(--sans); color: var(--muted); background: transparent; border: 0; border-radius: 999px; padding: 9px 13px 9px 9px; cursor: pointer; transition: background 160ms var(--ease), color 160ms var(--ease); }
.steps button:hover { background: rgb(18 24 38 / 0.06); }
.steps .n { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; font-size: 11px; background: rgb(18 24 38 / 0.07); color: var(--muted); transition: background 200ms var(--ease), color 200ms var(--ease); }
.steps button.done { color: var(--text); }
.steps button.done .n { background: var(--sage); color: var(--sheet); }
.steps button[aria-current="step"] { color: var(--ink); background: rgb(18 24 38 / 0.06); }
.steps button[aria-current="step"] .n { background: var(--red); color: var(--sheet); }
.tools { display: flex; gap: 4px; }
.ctrl { display: inline-flex; align-items: center; gap: 8px; font: 500 14px/1 var(--sans); color: var(--muted); background: transparent; border: 0; border-radius: 999px; padding: 10px 14px; cursor: pointer; }
.ctrl:hover { background: rgb(18 24 38 / 0.06); }
.ctrl .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
.ctrl[aria-pressed="false"] .dot { background: transparent; box-shadow: inset 0 0 0 1.5px var(--muted); }
button:focus-visible { outline: 2px solid var(--red); outline-offset: 3px; }
svg.i { width: 15px; height: 15px; flex: none; }

.stage { position: relative; display: grid; gap: 12px; padding: 16px; border-radius: 22px; background: #efe8db; box-shadow: inset 0 0 0 1px rgb(18 24 38 / 0.04); }
.desk { display: grid; grid-template-columns: 1.5fr 1fr; gap: 14px; height: 540px; }
.sheet { position: relative; min-width: 0; display: flex; flex-direction: column; background: var(--sheet); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
.sheet-head { display: flex; align-items: center; gap: 9px; padding: 13px 16px 11px; border-bottom: 1px solid var(--line); }
.sheet-head svg { width: 17px; height: 17px; color: var(--ink); }
.sheet-head strong { font-size: 14px; font-weight: 600; color: var(--ink); }
.sheet-head small { font-size: 12px; color: var(--muted); }
.draft { margin-left: auto; padding: 2px 8px; border-radius: 6px; background: var(--paper); font-size: 11px; color: var(--muted); }

/* the main sheet */
.doc-body { position: relative; flex: 1; min-height: 0; padding: 20px clamp(18px, 2.4vw, 30px); overflow: hidden; }
.doc-title { margin: 0 0 10px; font-family: var(--serif); font-weight: 700; font-size: 22px; color: var(--ink); }
.placeholder { margin: 0; font-size: 13px; color: var(--faint); }
.para { margin: 0 0 10px; font-size: 14.5px; line-height: 1.85; color: var(--text); }
.sec { margin: 14px 0 6px; font-size: 13px; font-weight: 600; color: var(--ink); }
.sec.faint { color: var(--faint); font-weight: 500; }
.s { border-radius: 3px; background: linear-gradient(var(--sel), var(--sel)) no-repeat 0 0 / 0% 100%; transition: background-size 620ms linear; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.s.sel { background-size: 100% 100%; }
.ins { display: none; }
.ins.on { display: inline; border-radius: 3px; animation: settle 1400ms var(--ease); }
@keyframes settle { 0% { background: rgb(143 182 155 / 0.45); } 100% { background: rgb(143 182 155 / 0); } }
.src-tag { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 6px; background: var(--paper); font-size: 11px; line-height: 1.6; color: var(--muted); vertical-align: 2px; white-space: nowrap; }
.src-tag svg { width: 11px; height: 11px; vertical-align: -1px; margin-right: 3px; }
.prev { display: none; color: var(--muted); }
.prev.on { display: inline; }
.prev .t { border-bottom: 1.5px dashed var(--red); }
.prev-actions { display: inline-flex; gap: 4px; margin-left: 6px; vertical-align: 1px; }
.mini { font: 500 11.5px/1 var(--sans); border: 0; border-radius: 6px; padding: 5px 8px; background: var(--paper); color: var(--text); transition: transform 130ms var(--ease); }
.mini.dark { background: var(--ink); color: var(--sheet); }
.mini.hit { transform: scale(0.93); }
.caret { display: inline-block; width: 2px; height: 1.1em; margin-left: 2px; vertical-align: -0.2em; background: var(--red); opacity: 0; }
.caret.on { opacity: 1; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.fn { display: none; margin-left: 1px; font-size: 10.5px; color: var(--red); font-weight: 600; }
.fn.on { display: inline; animation: pop 600ms var(--snap); }
@keyframes pop { 0% { transform: scale(0.3); } 100% { transform: none; } }
.footnote { margin-top: 14px; padding-top: 10px; border-top: 1px dashed var(--line); font-size: 12px; color: var(--muted); opacity: 0; transform: translateY(4px); transition: opacity 360ms var(--ease), transform 360ms var(--ease); }
.footnote.on { opacity: 1; transform: none; }
.footnote b { color: var(--red); font-weight: 600; margin-right: 4px; }

/* code story: the issue */
.view { display: none; }
.view.on { display: block; animation: rise 360ms var(--ease); }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.iss-meta { display: flex; align-items: center; gap: 6px; margin: 0 0 6px; font-size: 12px; color: var(--muted); }
.iss-meta svg { width: 14px; height: 14px; }
.iss-meta .lbl { margin-left: 4px; padding: 1px 7px; border-radius: 999px; background: var(--red-soft); color: #9c2f14; font-size: 11px; }
.log { margin: 8px 0 12px; padding: 11px 13px; border-radius: 10px; background: var(--term); color: var(--term-muted); font: 12px/1.75 var(--mono); white-space: pre-wrap; word-break: break-word; }
.log .em { color: #f2a48c; }
.log .s { color: var(--term-text); }
.log .s.sel { color: var(--ink); }
.back { margin-top: 10px; padding: 10px 12px 11px; border-radius: 12px; background: var(--paper); opacity: 0; transform: translateY(8px); transition: opacity 360ms var(--ease), transform 420ms var(--snap); }
.back.on { opacity: 1; transform: none; }
.back-h { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; font-size: 12px; color: var(--muted); }
.back-h b { color: var(--ink); font-weight: 600; }
.back p { margin: 0; font-size: 13.5px; line-height: 1.7; color: var(--ink); }
.back small { display: block; margin-top: 3px; font-size: 11.5px; color: var(--sage-deep); }
.back small.warn { color: var(--amber); }
.who { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; font-size: 9px; font-weight: 600; color: var(--ink); flex: none; }
.who.cc { background: var(--cc); }
.who.cx { background: var(--cx); }

/* side panel */
.side-tabs { display: flex; gap: 4px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.stab { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12.5px; color: var(--muted); white-space: nowrap; transition: background 200ms var(--ease), color 200ms var(--ease); }
.stab svg { width: 14px; height: 14px; }
.stab.on { background: rgb(18 24 38 / 0.06); color: var(--ink); }
.pane { display: none; flex: 1; min-height: 0; padding: 10px 14px 14px; overflow: hidden; }
.pane.on { display: flex; flex-direction: column; animation: rise 360ms var(--ease); }
.ib { display: grid; grid-template-columns: 18px 1fr; gap: 9px; align-items: start; padding: 9px 6px; border-radius: 10px; border-bottom: 1px solid var(--line); font-size: 12.5px; line-height: 1.5; transition: background 200ms var(--ease), opacity 300ms var(--ease); }
.ib .k svg { width: 15px; height: 15px; margin-top: 2px; color: var(--muted); }
.ib b { display: block; font-weight: 500; color: var(--ink); }
.ib small { font-size: 11.5px; color: var(--muted); }
.ib small em { font-style: normal; color: #9c2f14; }
.ib.open { background: rgb(18 24 38 / 0.05); }
.ib.hit { transform: scale(0.98); }

/* terminals in the side panel */
.pane.term { background: var(--term); color: var(--term-text); }
.term-head { display: flex; align-items: center; gap: 8px; padding-bottom: 8px; margin-bottom: 4px; border-bottom: 1px solid rgb(255 255 255 / 0.08); font-size: 12px; color: var(--term-muted); }
.term-head b { color: var(--term-text); font-weight: 600; }
.term-head .bind { margin-left: auto; padding: 1px 7px; border-radius: 6px; background: rgb(255 255 255 / 0.08); font-size: 11px; }
.lines { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; font: 12px/1.6 var(--mono); overflow: hidden; }
.ln { animation: rise 320ms var(--ease); white-space: pre-wrap; word-break: break-word; }
.ln.u { color: var(--term-text); }
.ln.u::before { content: '› '; color: var(--red); }
.ln.o { color: var(--term-muted); }
.ln.ok { color: #9be0ae; }
.ln.warn { color: #f2c66d; }

/* writing story: the video and Cognia */
.video { position: relative; height: 112px; margin-bottom: 10px; border-radius: 10px; background: linear-gradient(135deg, #1d2742, #3b2a3f); display: grid; place-items: center; color: rgb(255 252 246 / 0.85); flex: none; }
.video svg { width: 28px; height: 28px; }
.video small { position: absolute; left: 10px; bottom: 8px; font-size: 11px; color: rgb(255 252 246 / 0.75); }
.video .bar { position: absolute; left: 10px; right: 10px; bottom: 28px; height: 3px; border-radius: 2px; background: rgb(255 252 246 / 0.25); }
.video .bar i { display: block; width: 46%; height: 100%; border-radius: 2px; background: var(--red); }
.read-by { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; font-size: 11.5px; color: var(--muted); }
.read-by svg { width: 13px; height: 13px; color: var(--red); }
.tr { display: grid; grid-template-columns: 42px 1fr; gap: 8px; padding: 6px 0; font-size: 13px; line-height: 1.65; color: var(--text); }
.tr time { font: 11.5px/1.9 var(--mono); color: var(--muted); }
.cog-h { margin: 0 0 8px; font-size: 12.5px; color: var(--muted); }
.cog-h b { color: var(--ink); font-weight: 600; }
.note { padding: 10px 11px; margin-bottom: 8px; border-radius: 10px; background: var(--paper); font-size: 12.5px; line-height: 1.6; opacity: 0; transform: translateY(6px); transition: opacity 300ms var(--ease), transform 380ms var(--snap); }
.note.on { opacity: 1; transform: none; }
.note b { display: block; color: var(--ink); font-weight: 500; }
.note small { display: flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 11px; color: var(--muted); }
.note .cite { margin-left: auto; font: 500 11.5px/1 var(--sans); border: 0; border-radius: 6px; padding: 5px 8px; background: var(--ink); color: var(--sheet); transition: transform 130ms var(--ease); }
.note .cite.hit { transform: scale(0.93); }
.note.picked { box-shadow: inset 0 0 0 1.5px var(--red); }

/* dock */
.dock { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 14px; background: var(--sheet); box-shadow: var(--shadow); }
.dk { position: relative; display: grid; place-items: center; width: 34px; height: 34px; border-radius: 9px; color: var(--muted); flex: none; }
.dk svg { width: 17px; height: 17px; }
.dk.cur { background: rgb(18 24 38 / 0.06); color: var(--ink); }
.dk .badge { position: absolute; top: 2px; right: 1px; min-width: 15px; height: 15px; padding: 0 4px; border-radius: 999px; background: var(--red); color: var(--sheet); font-size: 10px; line-height: 15px; text-align: center; transform: scale(0); transition: transform 360ms cubic-bezier(0.34, 1.6, 0.5, 1); }
.dk .badge.on { transform: scale(1); }
.pill { flex: 1; min-width: 0; max-width: 420px; margin-left: auto; display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 999px; background: var(--paper); color: var(--faint); font-size: 12.5px; white-space: nowrap; overflow: hidden; }
.pill svg { width: 14px; height: 14px; color: var(--red); }
.pill-note { margin-left: auto; color: var(--red); font-size: 11.5px; opacity: 0; transition: opacity 400ms var(--ease); }
.pill-note.on { opacity: 1; }

/* floating bits */
.tb { position: absolute; top: 0; left: 0; z-index: 15; display: flex; align-items: center; gap: 2px; padding: 5px; border-radius: 12px; background: var(--ink); color: var(--sheet); white-space: nowrap; box-shadow: 0 18px 30px -16px rgb(0 0 0 / 0.55); opacity: 0; transform: translateY(6px) scale(0.98); transition: opacity 200ms var(--ease), transform 260ms var(--ease); pointer-events: none; }
.tb.on { opacity: 1; transform: none; }
.tb .div { width: 1px; height: 18px; margin: 0 4px; background: rgb(255 252 246 / 0.18); }
.tb .act { display: inline-flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 8px; color: var(--sheet); font: 500 12.5px/1 var(--sans); transition: transform 130ms var(--ease), background 200ms var(--ease); }
.tb .act.primary { background: var(--red); }
.tb .act.hit { transform: scale(0.93); }
.tb .land { display: inline-flex; align-items: center; gap: 5px; padding: 0 6px; font-size: 12px; color: #f7c1b2; }
.tb .ai { display: inline-flex; align-items: center; gap: 5px; padding: 0 8px; font-size: 12px; color: rgb(255 252 246 / 0.65); }
.pack { position: absolute; top: 0; left: 0; z-index: 16; width: 300px; padding: 13px 14px 12px; border-radius: 14px; background: var(--sheet); box-shadow: 0 24px 40px -22px rgb(40 24 10 / 0.7), 0 0 0 1px var(--line); font-size: 12.5px; opacity: 0; transform: translateY(6px); transition: opacity 220ms var(--ease), transform 280ms var(--ease); pointer-events: none; }
.pack.on { opacity: 1; transform: none; }
.pack-h { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; color: var(--ink); }
.pack-h svg { width: 15px; height: 15px; color: var(--red); }
.pack ul { margin: 9px 0 11px; padding: 0; list-style: none; display: grid; gap: 7px; }
.pack li { display: grid; grid-template-columns: 18px 1fr; gap: 8px; align-items: start; line-height: 1.45; color: var(--ink); opacity: 0; transform: translateX(-6px); transition: opacity 260ms var(--ease), transform 320ms var(--ease); }
.pack li.on { opacity: 1; transform: none; }
.pack li .mk { display: grid; place-items: center; width: 16px; height: 16px; margin-top: 1px; border-radius: 50%; background: var(--sage); }
.pack li .mk svg { width: 11px; height: 11px; color: var(--sheet); }
.pack li small { display: block; font-size: 11.5px; color: var(--muted); }
.opts { display: flex; gap: 6px; }
.opt { font: 500 12.5px/1 var(--sans); border: 0; border-radius: 9px; padding: 8px 12px; background: var(--paper); color: var(--ink); transition: background 200ms var(--ease), color 200ms var(--ease), transform 130ms var(--ease); }
.opt.dark { background: var(--ink); color: var(--sheet); }
.opt.hit { transform: scale(0.94); }
.toast { position: absolute; left: 50%; bottom: 74px; z-index: 16; display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-radius: 12px; background: var(--ink); color: var(--sheet); font-size: 12.5px; white-space: nowrap; box-shadow: 0 18px 30px -16px rgb(0 0 0 / 0.5); opacity: 0; transform: translate(-50%, 8px); transition: opacity 240ms var(--ease), transform 300ms var(--ease); pointer-events: none; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.toast svg { width: 14px; height: 14px; color: var(--sage); }
.toast .undo { display: inline-flex; align-items: center; gap: 4px; color: #f7c1b2; }
.toast .undo svg { color: #f7c1b2; }
.flyer { position: absolute; z-index: 20; max-width: 260px; overflow: hidden; text-overflow: ellipsis; padding: 6px 10px; border-radius: 9px; background: var(--sheet); color: var(--ink); font-size: 12px; white-space: nowrap; box-shadow: 0 16px 28px -14px rgb(40 24 10 / 0.7); pointer-events: none; }
.cursor { position: absolute; top: 0; left: 0; z-index: 30; width: 22px; height: 24px; pointer-events: none; transition-property: transform; transition-timing-function: var(--ease); }
.cursor svg { display: block; width: 22px; height: 24px; filter: drop-shadow(0 2px 3px rgb(0 0 0 / 0.25)); transition: transform 110ms var(--ease); transform-origin: 3px 2px; }
.cursor.down svg { transform: scale(0.84); }
.cursor.hidden { display: none; }
.ripple { position: absolute; z-index: 29; width: 26px; height: 26px; margin: -11px 0 0 -11px; border-radius: 50%; border: 2px solid var(--red); pointer-events: none; animation: ripple 520ms var(--ease) forwards; }
@keyframes ripple { from { transform: scale(0.3); opacity: 0.9; } to { transform: scale(1.4); opacity: 0; } }

/* room for a two-line explanation, so the frame does not change height between steps */
.caption { display: grid; gap: 6px; align-content: start; min-height: 132px; }
.cap-kicker { margin: 0; font-size: 12px; letter-spacing: 0.08em; color: var(--red); }
.cap-main { margin: 0; font-family: var(--serif); font-weight: 700; font-size: clamp(22px, 2.6vw, 30px); color: var(--ink); }
.cap-sub { margin: 0; max-width: 46em; font-size: 15px; line-height: 1.8; }
.foot-note { margin: 0; font-size: 12.5px; color: var(--muted); line-height: 1.7; border-top: 1px solid var(--line); padding-top: 14px; }

@media (max-width: 860px) {
  .desk { grid-template-columns: 1fr; height: auto; }
  .main { height: 470px; }
  .side { height: 330px; }
  .pill { display: none; }
  .stage { padding: 10px; }
  .pack { width: min(300px, calc(100% - 20px)); }
}
/* while skipping ahead to a step, everything lands at once */
.stage.jump *, .stage.jump *::before, .stage.jump *::after { transition: none !important; animation: none !important; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
html.embed .wrap > header, html.embed .foot-note { display: none; }
html.embed .wrap { max-width: none; padding-inline: 0; padding-block: 4px 12px; }
</style>

<main class="wrap">
  <header>
    <p class="eyebrow"><b>Molis Work</b> · 第一幕「递」· 动画小样 <a href="#dev" data-persona="dev">写代码</a><a href="#doc" data-persona="doc">写文档、管事情</a></p>
    <h1>不用开口，下一步就在手边。</h1>
  </header>

  <div class="bar">
    <ol class="steps" id="steps" aria-label="这一幕的几步"></ol>
    <div class="tools">
      <button id="replay" class="ctrl">从头看</button>
      <button id="autoplay" class="ctrl" aria-pressed="true"><span class="dot" aria-hidden="true"></span><span class="ctrl-text">自动播放中</span></button>
    </div>
  </div>

  <section class="stage" id="stage"></section>

  <div class="caption" aria-live="polite">
    <p class="cap-kicker" id="cap-kicker"></p>
    <p class="cap-main" id="cap-main"></p>
    <p class="cap-sub" id="cap-sub"></p>
  </div>

  <p class="foot-note" id="foot-note"></p>
</main>

<!-- the code story: an issue in Inbox goes to Codex with everything it needs, comes back, goes to Claude Code for review -->
<template id="stage-dev">
  <div class="desk">
    <article class="sheet main">

  async function moveTo(el, fx = 0.5, fy = 0.55) {
    const r = box(el);
    await moveToPoint(r.x + r.w * fx, r.y + r.h * fy);
  }
  async function click(el) {
    if (instant) return;
    cursor.classList.add('down');
    if (el) el.classList.add('hit');
    const rp = document.createElement('span');
    rp.className = 'ripple';
    rp.style.left = cur.x + 'px';
    rp.style.top = cur.y + 'px';
    stage.appendChild(rp);
    setTimeout(() => rp.remove(), 540);
    await sleep(150);
    cursor.classList.remove('down');
    if (el) el.classList.remove('hit');
    await sleep(140);
  }
  async function dragSelect(span) {
    const a = box(span);
    const b = box(span, true);
    await moveToPoint(a.x + 1, a.y + a.h * 0.62);
    span.classList.add('sel');
    cursorAt(b.x + b.w, b.y + b.h * 0.62, 640);
    await sleep(720);
  }

  // ---------- floating bar, toast, flyer ----------
  function showBar(anchor, cfg) {
    let html = '';
    if (cfg.landing) html += `<span class="land">${svg('arrow-right')}${cfg.landing}</span><span class="div"></span>`;
    html += cfg.actions.map((a) => `<span class="act${a.primary ? ' primary' : ''}"${a.id ? ` data-id="${a.id}"` : ''}>${a.icon ? svg(a.icon) : ''}${a.label}</span>`).join('');
    html += `<span class="div"></span><span class="ai">${svg('sparkles')}助理</span>`;
    tb.innerHTML = html;
    const r = box(anchor);
    const W = stage.clientWidth;
    const w = tb.offsetWidth;
    const h = tb.offsetHeight;
    let left = r.x + r.w / 2 - w / 2;
    left = Math.max(8, Math.min(W - w - 8, left));
    let top = r.y - h - 10;
    if (top < 8) top = r.y + r.h + 10;
    tb.style.left = left + 'px';
    tb.style.top = top + 'px';
    tb.classList.add('on');
  }
  const hideBar = () => tb.classList.remove('on');
  const barItem = (id) => tb.querySelector(`[data-id="${id}"]`);
  function showToast(html) {
    toast.innerHTML = html;
    toast.classList.add('on');
  }
  function fly(fromEl, toEl, label) {
    if (instant || reduce) return Promise.resolve();
    const a = box(fromEl);
    const b = box(toEl);
    const f = document.createElement('div');
    f.className = 'flyer';
    f.textContent = label;
    f.style.left = a.x + 'px';
    f.style.top = a.y - 4 + 'px';
    stage.appendChild(f);
    const dx = b.x + b.w / 2 - (a.x + f.offsetWidth / 2);
    const dy = b.y + b.h / 2 - (a.y - 4 + f.offsetHeight / 2);
    const anim = f.animate([
      { transform: 'translate(0, 0) scale(1)', opacity: 1 },
      { transform: `translate(${dx * 0.55}px, ${dy * 0.35 - 40}px) scale(0.9)`, opacity: 1, offset: 0.5 },
      { transform: `translate(${dx}px, ${dy}px) scale(0.3)`, opacity: 0.2 },
    ], { duration: 860, easing: 'cubic-bezier(0.3, 0.7, 0.3, 1)' });
    // a background tab may never finish the animation; move on after its duration anyway
    return Promise.race([anim.finished, new Promise((r) => setTimeout(r, 1040))]).then(() => f.remove(), () => f.remove());
  }

  function setTab(name) {
    document.querySelectorAll('.stab').forEach((t) => t.classList.toggle('on', t.dataset.tab === name));
    document.querySelectorAll('.pane').forEach((p) => p.classList.toggle('on', p.dataset.pane === name));
  }
  function line(term, text, cls = 'o') {
    const ln = document.createElement('div');
    ln.className = 'ln ' + cls;
    ln.textContent = text;
    $(term).appendChild(ln);
    return ln;
  }
  async function lines(term, list, alive, gap = 420) {
    for (const [text, cls] of list) {
      line(term, text, cls);
      await sleep(gap);
      if (!alive()) return;
    }
  }
  function setStep(i) {
    stepBtns.forEach((b, k) => {
      b.classList.toggle('done', k < i);
      if (k === i) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current');
    });
    $('cap-kicker').textContent = `第 ${i + 1} 步，共 ${S.steps.length} 步`;
    $('cap-main').textContent = S.steps[i].main;
    $('cap-sub').textContent = S.steps[i].sub;
  }
  function setFinal() {
    stepBtns.forEach((b) => { b.classList.add('done'); b.removeAttribute('aria-current'); });
    $('cap-kicker').textContent = S.final.kicker;
    $('cap-main').textContent = S.final.main;
    $('cap-sub').textContent = S.final.sub;
    $('pill-note').classList.add('on');
  }

  // ---------- the two stories ----------
  const RESET = {
    dev() {
      $('d-empty').hidden = false;
      $('issue').classList.remove('on');
      $('m-name').textContent = 'Inbox';
      $('m-icon').innerHTML = svg('inbox');
      ['back-cx', 'back-cc', 'badge', 'pack'].forEach((id) => $(id).classList.remove('on'));
      document.querySelectorAll('.pack li').forEach((li) => li.classList.remove('on'));
      document.querySelectorAll('.ib').forEach((i) => i.classList.remove('open'));
      $('t-codex').innerHTML = '';
      $('t-claude').innerHTML = '';
    },
    doc() {
      ['ins', 'prev', 'caret', 'fn', 'footnote'].forEach((id) => $(id).classList.remove('on'));
      document.querySelectorAll('.note').forEach((n) => n.classList.remove('on', 'picked'));
      document.querySelectorAll('.ib').forEach((i) => i.classList.remove('open'));
    },
  };
  const STEPS = {
    dev: [
      async (alive) => {
        setTab('inbox');
        await sleep(500); if (!alive()) return;
        const it = $('ib-open');
        await moveTo(it, 0.4); if (!alive()) return;
        await click(it);
        it.classList.add('open');
        $('d-empty').hidden = true;
        $('issue').classList.add('on');
        $('m-name').textContent = '#318';
        $('m-icon').innerHTML = svg('github');
        await sleep(1500);
      },
      async (alive) => {
        await dragSelect($('s-err')); if (!alive()) return;
        showBar($('s-err'), { actions: [{ id: 'cx', icon: 'terminal', label: '交给 Codex', primary: true }, { icon: 'terminal', label: '交给 Claude Code' }, { icon: 'list-checks', label: '记成待办' }] });
        await sleep(900); if (!alive()) return;
        await moveTo(barItem('cx')); if (!alive()) return;
        await click(barItem('cx'));
        hideBar();
        const r = box($('s-err'));
        const pack = $('pack');
        pack.style.left = Math.max(8, Math.min(stage.clientWidth - pack.offsetWidth - 8, r.x + 30)) + 'px';
        pack.style.top = r.y + r.h + 14 + 'px';
        pack.classList.add('on');
        for (const li of document.querySelectorAll('.pack li')) {
          await sleep(380); if (!alive()) return;
          li.classList.add('on');
        }
        await sleep(700); if (!alive()) return;
        await moveTo($('pack-send')); if (!alive()) return;
        await click($('pack-send'));
        pack.classList.remove('on');
        $('s-err').classList.remove('sel');
        setTab('codex');
        await lines('t-codex', [
          ['读到交接包：#318 · 目标「上线支付」· 设计约束 · 上次进度', 'u'],
          ['按「回调必须幂等」来改', 'o'],
          ['验签允许 5 分钟偏差，订单号做幂等键', 'o'],
          ['✓ 测试 8/8 通过', 'ok'],
          ['结果写回 #318', 'o'],
        ], alive, 480);
        await sleep(600);
      },
      async (alive) => {
        $('back-cx').classList.add('on');
        await sleep(900); if (!alive()) return;
        await dragSelect($('s-fix')); if (!alive()) return;
        showBar($('s-fix'), { actions: [{ id: 'cc', icon: 'terminal', label: '交给 Claude Code 复核', primary: true }, { icon: 'git-compare', label: '看改动' }, { icon: 'list-checks', label: '记成待办' }] });
        await sleep(900); if (!alive()) return;
        await moveTo(barItem('cc')); if (!alive()) return;
        await click(barItem('cc'));
        hideBar();
        $('s-fix').classList.remove('sel');
        setTab('claude');
        await lines('t-claude', [
          ['复核 Codex 对 #318 的改动', 'u'],
          ['✓ 验签偏差的处理没问题', 'ok'],
          ['✓ 幂等键没问题', 'ok'],
          ['△ 没覆盖：Safari 14 下付款后跳回订单页', 'warn'],
          ['结果写回 #318', 'o'],
        ], alive, 480);
        $('back-cc').classList.add('on');
        await sleep(1300);
      },
      async (alive) => {
        await dragSelect($('s-todo')); if (!alive()) return;
        showBar($('s-todo'), { actions: [{ id: 'todo', icon: 'list-checks', label: '记成待办', primary: true }, { icon: 'terminal', label: '交给 Codex' }, { label: '拆成小步' }] });
        await sleep(900); if (!alive()) return;
        await moveTo(barItem('todo')); if (!alive()) return;
        await click(barItem('todo'));
        hideBar();
        await fly($('s-todo'), $('dock-todo'), 'Safari 14 下付款后跳回订单页');
        if (!alive()) return;
        $('badge').classList.add('on');
        $('s-todo').classList.remove('sel');
        showToast(`${svg('check')}已记进待办 · 连着 #318<span class="undo">${svg('undo-2')}撤销</span>`);
        await sleep(1800);
        cursor.classList.add('hidden');
      },
    ],
    doc: [
      async (alive) => {
        setTab('inbox');
        await sleep(500); if (!alive()) return;
        const it = $('ib-open');
        await moveTo(it, 0.4); if (!alive()) return;
        await click(it);
        it.classList.add('open');
        await sleep(300); if (!alive()) return;
        setTab('video');
        await sleep(1500);
      },
      async (alive) => {
        $('caret').classList.add('on');
        await dragSelect($('s-quote')); if (!alive()) return;
        showBar($('s-quote'), { landing: '《AI 编辑器观察》· 第 2 节', actions: [{ id: 'put', icon: 'corner-down-left', label: '放进去', primary: true }, { icon: 'lightbulb', label: '记下灵光' }, { icon: 'book-open', label: '在我的资料里找依据' }] });
        $('p2').animate([{ background: 'rgb(238 78 43 / 0.09)' }, { background: 'transparent' }], { duration: 1100 });
        await sleep(1000); if (!alive()) return;
        await moveTo(barItem('put')); if (!alive()) return;
        await click(barItem('put'));
        hideBar();
        $('caret').classList.remove('on');
        $('prev').classList.add('on');
        await sleep(800); if (!alive()) return;
        await moveTo($('prev-ok')); if (!alive()) return;
        await click($('prev-ok'));
        $('prev').classList.remove('on');
        $('ins').classList.add('on');
        $('s-quote').classList.remove('sel');
        showToast(`${svg('check')}已放进第 2 节 · 出处：视频 12:40<span class="undo">${svg('undo-2')}撤销</span>`);
        await sleep(1800);
        toast.classList.remove('on');
      },
      async (alive) => {
        await dragSelect($('s-claim')); if (!alive()) return;
        showBar($('s-claim'), { actions: [{ id: 'find', icon: 'book-open', label: '在我的资料里找依据', primary: true }, { icon: 'lightbulb', label: '记下灵光' }, { label: '拆成提纲' }] });
        await sleep(900); if (!alive()) return;
        await moveTo(barItem('find')); if (!alive()) return;
        await click(barItem('find'));
        hideBar();
        setTab('cognia');
        for (const id of ['n1', 'n2', 'n3']) {
          await sleep(420); if (!alive()) return;
          $(id).classList.add('on');
        }
        await sleep(1000);
      },
      async (alive) => {
        await moveTo($('cite')); if (!alive()) return;
        await click($('cite'));
        $('n1').classList.add('picked');
        await fly($('n1'), $('fn'), '平台的粘性来自工作流，不是功能');
        if (!alive()) return;
        $('s-claim').classList.remove('sel');
        $('fn').classList.add('on');
        $('footnote').classList.add('on');
        showToast(`${svg('check')}已引用 · 点开能回到原来的笔记`);
        await sleep(1800);
        cursor.classList.add('hidden');
      },
    ],
  };
  const steps = STEPS[P];

  function reset() {
    RESET[P]();
    document.querySelectorAll('.s').forEach((s) => s.classList.remove('sel'));
    $('pill-note').classList.remove('on');
    hideBar();
    toast.classList.remove('on');
    stage.querySelectorAll('.flyer, .ripple').forEach((n) => n.remove());
    setTab('inbox');
    cursor.classList.toggle('hidden', reduce);
    const saved = instant;
    instant = true;
    cursorAt(stage.clientWidth - 90, stage.clientHeight - 70, 0);
    instant = saved;
  }

  async function play(fromStep = 0) {
    const id = ++runId;
    const alive = () => id === runId;
    setInstant(fromStep > 0 || reduce);
    reset();
    for (let k = 0; k < steps.length; k++) {
      if (fromStep === k && !reduce) setInstant(false);
      if (!instant) setStep(k);
      await steps[k](alive);
      if (!alive()) return;
    }
    // a still frame of the finished story: show it, do not loop
    if (fromStep >= steps.length || reduce) { setInstant(false); setFinal(); toast.classList.remove('on'); cursor.classList.add('hidden'); return; }
    setInstant(false);
    setFinal();
    await sleep(4500); if (!alive()) return;
    if (autoplay) play(0);
  }

  // ---------- controls ----------
  stepBtns.forEach((b) => b.addEventListener('click', () => play(Number(b.dataset.step))));
  $('replay').addEventListener('click', () => play(0));
  function syncAuto() {
    autoBtn.setAttribute('aria-pressed', String(autoplay));
    autoBtn.querySelector('.ctrl-text').textContent = autoplay ? '自动播放中' : '自动播放已停';
  }
  autoBtn.addEventListener('click', () => { autoplay = !autoplay; syncAuto(); if (autoplay) play(0); });
  syncAuto();

  // a complete resting frame (the finished story), then play from the start
  play(steps.length);
  if (EMBED) embed(() => play(0), (on) => { autoplay = on; syncAuto(); });
  else if (!reduce) setTimeout(() => { if (runId === 1) play(0); }, 1400);
})();
</script>

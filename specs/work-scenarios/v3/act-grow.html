<title>Molis Work 越用越顺手小样</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@1,6..72,400&family=Noto+Serif+SC:wght@500;700&display=swap">
<style>
/* Layout: the same desk as act one: a main sheet on the left that changes with the step (the plugin studio, the plugin you made, a workflow), Inbox on the right, a dock below. A pointer and a floating bar show what comes to hand. */
:root {
  --paper: #f5f0e6;
  --sheet: #fffcf6;
  --ink: #121826;
  --text: #33312c;
  --muted: #6f695f;
  --faint: #a39d92;
  --line: rgb(18 24 38 / 0.12);
  --red: #ee4e2b;
  --red-soft: #fbe0d8;
  --amber-soft: #fbefd2;
  --sage: #8fb69b;
  --sage-soft: #e3eee5;
  --sage-deep: #2f6b45;
  --peri: #b9c6f5;
  --pink: #f4b4c0;
  --yellow: #f6c445;
  --term: #151b29;
  --term-text: #e8e3d8;
  --term-muted: #8d93a3;
  --serif: 'Noto Serif SC', 'Songti SC', 'STSong', serif;
  --display: 'Newsreader', Georgia, serif;
  --sans: 'Geist', 'PingFang SC', 'Hiragino Sans GB', system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, 'PingFang SC', monospace;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  --snap: cubic-bezier(0.34, 1.4, 0.5, 1);
  --shadow: 0 18px 34px -24px rgb(40 24 10 / 0.55), 0 1px 0 rgb(18 24 38 / 0.05);
  color-scheme: light;
}
body { background: var(--paper); color: var(--text); font-family: var(--sans); }
[hidden] { display: none !important; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: clamp(16px, 3.2vw, 48px); padding-block: clamp(28px, 5vw, 64px) 48px; display: grid; gap: 22px; }
.eyebrow { margin: 0; font-size: 12px; letter-spacing: 0.08em; color: var(--muted); }
.eyebrow b { color: var(--red); font-weight: 500; }
.eyebrow a { margin-left: 8px; color: var(--muted); }
.eyebrow a.on { color: var(--ink); font-weight: 500; }
h1 { margin: 6px 0 0; font-family: var(--serif); font-weight: 700; color: var(--ink); font-size: clamp(30px, 4.6vw, 54px); line-height: 1.15; letter-spacing: -0.01em; text-wrap: balance; }

.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.steps { display: flex; flex-wrap: wrap; gap: 4px; margin: 0; padding: 0; list-style: none; }
.steps button { display: inline-flex; align-items: center; gap: 8px; font: 500 14px/1 var(--sans); color: var(--muted); background: transparent; border: 0; border-radius: 999px; padding: 9px 13px 9px 9px; cursor: pointer; transition: background 160ms var(--ease), color 160ms var(--ease); }
.steps button:hover { background: rgb(18 24 38 / 0.06); }
.steps .n { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; font-size: 11px; background: rgb(18 24 38 / 0.07); color: var(--muted); transition: background 200ms var(--ease), color 200ms var(--ease); }
.steps button.done { color: var(--text); }
.steps button.done .n { background: var(--sage); color: var(--sheet); }
.steps button[aria-current="step"] { color: var(--ink); background: rgb(18 24 38 / 0.06); }
.steps button[aria-current="step"] .n { background: var(--red); color: var(--sheet); }
.tools { display: flex; gap: 4px; }
.ctrl { display: inline-flex; align-items: center; gap: 8px; font: 500 14px/1 var(--sans); color: var(--muted); background: transparent; border: 0; border-radius: 999px; padding: 10px 14px; cursor: pointer; }
.ctrl:hover { background: rgb(18 24 38 / 0.06); }
.ctrl .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
.ctrl[aria-pressed="false"] .dot { background: transparent; box-shadow: inset 0 0 0 1.5px var(--muted); }
button:focus-visible { outline: 2px solid var(--red); outline-offset: 3px; }
svg.i { width: 15px; height: 15px; flex: none; }

.stage { position: relative; display: grid; gap: 12px; padding: 16px; border-radius: 22px; background: #efe8db; box-shadow: inset 0 0 0 1px rgb(18 24 38 / 0.04); }
.desk { display: grid; grid-template-columns: 1.45fr 1fr; gap: 14px; height: 520px; }
.sheet { position: relative; min-width: 0; display: flex; flex-direction: column; background: var(--sheet); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
.sheet-head { display: flex; align-items: center; gap: 9px; padding: 13px 16px 11px; border-bottom: 1px solid var(--line); }
.sheet-head svg { width: 17px; height: 17px; color: var(--ink); }
.sheet-head strong { font-size: 14px; font-weight: 600; color: var(--ink); }
.sheet-head small { font-size: 12px; color: var(--muted); }
.sheet-head .yours-tag { padding: 1px 7px; border-radius: 6px; background: var(--red-soft); color: #9c2f14; font-size: 11px; }
.clock { margin-left: auto; padding: 3px 9px; border-radius: 999px; background: var(--paper); font-size: 11.5px; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
.main-body { position: relative; flex: 1; min-height: 0; padding: 20px; overflow: hidden; }
.view { display: none; height: 100%; flex-direction: column; }
.view.on { display: flex; animation: rise 360ms var(--ease); }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* the studio */
.prompt { padding: 13px 15px; border-radius: 12px; background: var(--paper); font-size: 14px; line-height: 1.7; color: var(--ink); min-height: 50px; }
.prompt:empty::before { content: '想要一个什么插件？说一句。'; color: var(--faint); }
.typing-caret { display: inline-block; width: 2px; height: 1.05em; margin-left: 1px; vertical-align: -0.15em; background: var(--red); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.checks { margin: 16px 0 0; padding: 0; list-style: none; display: grid; gap: 9px; }
.checks li { display: grid; grid-template-columns: 20px 1fr; gap: 10px; align-items: center; font-size: 13.5px; color: var(--faint); transition: color 300ms var(--ease); }
.checks .mk { display: grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--line); transition: background 300ms var(--ease), box-shadow 300ms var(--ease); }
.checks .mk svg { width: 12px; height: 12px; color: var(--sheet); opacity: 0; }
.checks li.on { color: var(--ink); }
.checks li.on .mk { background: var(--sage); box-shadow: none; }
.checks li.on .mk svg { opacity: 1; }
.newtile { display: flex; align-items: center; gap: 12px; margin-top: auto; padding: 12px 14px; border-radius: 14px; background: var(--paper); opacity: 0; transform: scale(0.9); transition: opacity 300ms var(--ease), transform 520ms var(--snap); }
.newtile.on { opacity: 1; transform: none; }
.newtile .ic { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; background: var(--red-soft); flex: none; }
.newtile .ic svg { width: 22px; height: 22px; color: #9c2f14; }
.newtile b { display: block; font-size: 14px; color: var(--ink); }
.newtile small { font-size: 12px; color: var(--muted); }

/* the plugin you made: release checklist */
.rel-h { margin: 0 0 6px; font-size: 11.5px; font-weight: 500; color: var(--muted); letter-spacing: 0.04em; }
.rel-h + .rl { margin-top: 0; }
.rl { display: grid; grid-template-columns: 18px 1fr; gap: 8px; align-items: start; padding: 6px 9px; margin-bottom: 4px; border-radius: 9px; background: var(--sage-soft); font-size: 13px; line-height: 1.5; color: var(--ink); }
.rl svg { width: 14px; height: 14px; margin-top: 3px; color: var(--sage-deep); }
.rl small { display: block; font-size: 11.5px; color: var(--muted); }
.rl.warn { background: var(--amber-soft); }
.rl.warn svg { color: #9a6a0c; }
.rl.flash { animation: flash 1200ms var(--ease); }
@keyframes flash { 0%, 100% { box-shadow: none; } 30% { box-shadow: 0 0 0 2px var(--red); } }
.group { margin-bottom: 12px; }
.notes { margin: 0; padding: 10px 12px; border-radius: 10px; background: var(--paper); list-style: none; display: grid; gap: 5px; font-size: 13px; line-height: 1.55; color: var(--text); }
.notes li::before { content: '· '; color: var(--muted); }
.notes li.new { color: var(--ink); animation: rise 420ms var(--ease); }
.notes li small { margin-left: 6px; padding: 0 6px; border-radius: 5px; background: var(--sheet); font-size: 11px; color: var(--muted); }

/* the plugin you made: topic library */
.topics { width: 100%; border-collapse: collapse; font-size: 13px; }
.topics th { text-align: left; font-weight: 500; font-size: 11.5px; color: var(--muted); padding: 0 8px 8px; }
.topics td { padding: 9px 8px; border-top: 1px solid var(--line); vertical-align: top; }
.topics td small { display: block; font-size: 11px; color: var(--muted); }
.topics tr.new td { animation: landrow 1400ms var(--ease); }
@keyframes landrow { 0% { background: rgb(238 78 43 / 0.16); } 100% { background: transparent; } }
.heat { color: var(--red); letter-spacing: 1px; white-space: nowrap; }
.st { display: inline-block; padding: 1px 7px; border-radius: 6px; background: var(--paper); font-size: 11px; color: var(--muted); white-space: nowrap; }
.st.on { background: var(--sage-soft); color: var(--sage-deep); }
.board-foot { margin-top: auto; font-size: 12px; color: var(--muted); }

/* workflow */
.flow-empty { margin: 0; font-size: 13px; color: var(--faint); }
.flowline { display: flex; align-items: flex-start; justify-content: center; margin-top: 40px; }
.stn { display: grid; justify-items: center; gap: 9px; width: 92px; opacity: 0; transform: translateY(12px) scale(0.6); transition: opacity 300ms var(--ease), transform 520ms var(--snap); text-align: center; }
.stn.on { opacity: 1; transform: none; }
.stn .ic { display: grid; place-items: center; width: 62px; height: 62px; border-radius: 16px; background: var(--sheet); box-shadow: 0 14px 26px -16px rgb(40 24 10 / 0.6), 0 0 0 1px var(--line); transition: background 360ms var(--ease); }
.stn .ic svg { width: 26px; height: 26px; color: var(--ink); }
.stn.mine .ic { box-shadow: 0 14px 26px -16px rgb(40 24 10 / 0.6), 0 0 0 1.5px var(--red); }
.stn.lit .ic { background: var(--c); }
.stn span:last-child { font-size: 12.5px; line-height: 1.4; color: var(--ink); }
.conn { position: relative; width: clamp(44px, 8vw, 110px); height: 2px; margin-top: 30px; background: rgb(18 24 38 / 0.14); transform: scaleX(0); transform-origin: left; transition: transform 420ms var(--ease); }
.conn.on { transform: scaleX(1); }
.conn i { position: absolute; inset: 0; background: var(--red); transform: scaleX(0); transform-origin: left; transition: transform 640ms linear; }
.conn.run i { transform: scaleX(1); }
.conn small { position: absolute; top: -24px; left: 50%; transform: translateX(-50%); font-size: 11px; color: var(--muted); white-space: nowrap; }
.sched { align-self: center; display: inline-flex; align-items: center; gap: 7px; margin-top: 30px; padding: 6px 12px; border-radius: 999px; background: var(--paper); font-size: 12.5px; color: var(--ink); opacity: 0; transition: opacity 400ms var(--ease); }
.sched.on { opacity: 1; }
.results { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: auto; }
.res { display: inline-flex; align-items: center; gap: 9px; padding: 10px 14px; border-radius: 12px; background: var(--paper); font-size: 13px; color: var(--ink); opacity: 0; transform: translateY(8px); transition: opacity 320ms var(--ease), transform 420ms var(--snap); }
.res.on { opacity: 1; transform: none; }
.res small { display: block; font-size: 11.5px; color: var(--muted); }

/* inbox */
.ib-list { flex: 1; min-height: 0; padding: 6px 14px 12px; overflow: hidden; }
.ib { display: grid; grid-template-columns: 16px 18px 1fr; gap: 9px; align-items: start; padding: 9px 2px; border-bottom: 1px solid var(--line); font-size: 12.5px; line-height: 1.5; }
.ib.new { animation: rise 420ms var(--ease); }
.ib .tick { width: 15px; height: 15px; margin-top: 2px; border-radius: 4px; box-shadow: inset 0 0 0 1.5px var(--faint); display: grid; place-items: center; transition: background 160ms var(--ease), box-shadow 160ms var(--ease); }
.ib .tick svg { width: 11px; height: 11px; color: var(--sheet); opacity: 0; }
.ib.on .tick { background: var(--ink); box-shadow: none; }
.ib.on .tick svg { opacity: 1; }
.ib .k svg { width: 15px; height: 15px; margin-top: 2px; color: var(--muted); }
.ib b { display: block; font-weight: 500; color: var(--ink); }
.ib small { font-size: 11.5px; color: var(--muted); }
.ib small em { font-style: normal; color: #9c2f14; }

/* dock */
.dock { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 14px; background: var(--sheet); box-shadow: var(--shadow); }
.dk { position: relative; display: grid; place-items: center; width: 34px; height: 34px; border-radius: 9px; color: var(--muted); flex: none; }
.dk svg { width: 17px; height: 17px; }
.dk.cur { background: rgb(18 24 38 / 0.06); color: var(--ink); }
.dk.ping { animation: ping 1100ms var(--snap); }
@keyframes ping { 0% { transform: scale(1); } 35% { transform: scale(1.25); background: var(--red-soft); color: #9c2f14; } 100% { transform: scale(1); } }
.dk.newp { display: none; background: var(--red-soft); color: #9c2f14; }
.dk.newp.on { display: grid; animation: pop 700ms var(--snap); }
@keyframes pop { 0% { transform: scale(0.2) rotate(-30deg); } 100% { transform: none; } }
.dk.newp::after { content: ''; position: absolute; top: 3px; right: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 2px var(--sheet); }
.pill { flex: 1; min-width: 0; max-width: 460px; margin-left: auto; display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 999px; background: var(--paper); color: var(--faint); font-size: 12.5px; white-space: nowrap; overflow: hidden; transition: box-shadow 200ms var(--ease); }
.pill svg { width: 14px; height: 14px; color: var(--red); }
.pill.typing { color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--red); }
.pill .send { margin-left: auto; display: none; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--ink); flex: none; }
.pill .send svg { width: 13px; height: 13px; color: var(--sheet); }
.pill.typing .send { display: grid; }

/* floating bits */
.tb { position: absolute; top: 0; left: 0; z-index: 15; display: flex; align-items: center; gap: 2px; padding: 5px; border-radius: 12px; background: var(--ink); color: var(--sheet); white-space: nowrap; box-shadow: 0 18px 30px -16px rgb(0 0 0 / 0.55); opacity: 0; transform: translateY(6px) scale(0.98); transition: opacity 200ms var(--ease), transform 260ms var(--ease); pointer-events: none; }
.tb.on { opacity: 1; transform: none; }
.tb .div { width: 1px; height: 18px; margin: 0 4px; background: rgb(255 252 246 / 0.18); }
.tb .act { display: inline-flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 8px; color: var(--sheet); font: 500 12.5px/1 var(--sans); transition: transform 130ms var(--ease); }
.tb .act.primary { background: var(--red); }
.tb .act.hit { transform: scale(0.93); }
.tb .tag { padding: 2px 6px; border-radius: 5px; background: rgb(255 252 246 / 0.22); font-size: 10.5px; }
.tb .ai { display: inline-flex; align-items: center; gap: 5px; padding: 0 8px; font-size: 12px; color: rgb(255 252 246 / 0.65); }
.reply { position: absolute; top: 0; left: 0; z-index: 16; max-width: 400px; display: flex; gap: 9px; padding: 11px 13px; border-radius: 14px; background: var(--sheet); box-shadow: 0 24px 40px -22px rgb(40 24 10 / 0.7), 0 0 0 1px var(--line); font-size: 13px; line-height: 1.6; color: var(--ink); opacity: 0; transform: translateY(6px); transition: opacity 240ms var(--ease), transform 300ms var(--ease); pointer-events: none; }
.reply.on { opacity: 1; transform: none; }
.reply .av { flex: none; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--red); }
.reply .av svg { width: 12px; height: 12px; color: var(--sheet); }
.toast { position: absolute; left: 50%; bottom: 74px; z-index: 16; display: flex; align-items: center; gap: 9px; padding: 9px 14px; border-radius: 12px; background: var(--ink); color: var(--sheet); font-size: 12.5px; white-space: nowrap; box-shadow: 0 18px 30px -16px rgb(0 0 0 / 0.5); opacity: 0; transform: translate(-50%, 8px); transition: opacity 240ms var(--ease), transform 300ms var(--ease); pointer-events: none; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.toast svg { width: 14px; height: 14px; color: var(--sage); }
.ext { position: absolute; left: 30px; bottom: 82px; z-index: 14; width: min(400px, calc(100% - 60px)); padding: 12px 14px; border-radius: 12px; background: var(--term); color: var(--term-text); font-family: var(--mono); font-size: 12px; line-height: 1.65; box-shadow: 0 24px 40px -22px rgb(10 14 24 / 0.9); opacity: 0; transform: translateY(10px); transition: opacity 300ms var(--ease), transform 360ms var(--ease); pointer-events: none; }
.ext.on { opacity: 1; transform: none; }
.ext .h { display: flex; align-items: center; gap: 7px; margin-bottom: 6px; font-family: var(--sans); font-size: 12px; color: var(--term-muted); }
.ext .h svg { width: 14px; height: 14px; }
.ext .u::before { content: '› '; color: var(--red); }
.ext .o { color: var(--term-muted); }
.ext .ok { color: #9be0ae; }
.ext.chat { background: #fbf8f2; color: var(--text); font-family: var(--sans); font-size: 12.5px; box-shadow: 0 24px 40px -22px rgb(40 24 10 / 0.7), 0 0 0 1px var(--line); }
.ext.chat .h { color: var(--muted); }
.ext.chat .h b { color: var(--ink); }
.ext.chat .u { justify-self: end; margin-left: auto; width: fit-content; padding: 6px 10px; border-radius: 10px; background: var(--ink); color: var(--sheet); }
.ext.chat .u::before { content: none; }
.ext.chat .o { color: var(--muted); font-size: 11.5px; }
.ext.chat .ok { color: var(--ink); }
.ext.chat #ext-lines { display: grid; gap: 5px; }
.ext.chat { left: auto; right: 30px; }
.flyer { position: absolute; z-index: 20; max-width: 260px; overflow: hidden; text-overflow: ellipsis; padding: 6px 10px; border-radius: 9px; background: var(--sheet); color: var(--ink); font-size: 12px; white-space: nowrap; box-shadow: 0 16px 28px -14px rgb(40 24 10 / 0.7); pointer-events: none; }
.cursor { position: absolute; top: 0; left: 0; z-index: 30; width: 22px; height: 24px; pointer-events: none; transition-property: transform; transition-timing-function: var(--ease); }
.cursor svg { display: block; width: 22px; height: 24px; filter: drop-shadow(0 2px 3px rgb(0 0 0 / 0.25)); transition: transform 110ms var(--ease); transform-origin: 3px 2px; }
.cursor.down svg { transform: scale(0.84); }
.cursor.hidden { display: none; }
.ripple { position: absolute; z-index: 29; width: 26px; height: 26px; margin: -11px 0 0 -11px; border-radius: 50%; border: 2px solid var(--red); pointer-events: none; animation: ripple 520ms var(--ease) forwards; }
@keyframes ripple { from { transform: scale(0.3); opacity: 0.9; } to { transform: scale(1.4); opacity: 0; } }

/* room for a two-line explanation, so the frame does not change height between steps */
.caption { display: grid; gap: 6px; align-content: start; min-height: 132px; }
.cap-kicker { margin: 0; font-size: 12px; letter-spacing: 0.08em; color: var(--red); }
.cap-main { margin: 0; font-family: var(--serif); font-weight: 700; font-size: clamp(22px, 2.6vw, 30px); color: var(--ink); }
.cap-sub { margin: 0; max-width: 46em; font-size: 15px; line-height: 1.8; }
.foot-note { margin: 0; font-size: 12.5px; color: var(--muted); line-height: 1.7; border-top: 1px solid var(--line); padding-top: 14px; }

@media (max-width: 860px) {
  .desk { grid-template-columns: 1fr; height: auto; }
  .main { height: 440px; }
  .side { height: 300px; }
  .stn { width: 72px; }
  .stn .ic { width: 52px; height: 52px; }
  .stage { padding: 10px; }
  .ext, .ext.chat { left: 16px; right: auto; width: calc(100% - 32px); }
}
/* while skipping ahead to a step, everything lands at once */
.stage.jump *, .stage.jump *::before, .stage.jump *::after { transition: none !important; animation: none !important; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
html.embed .wrap > header, html.embed .foot-note { display: none; }
html.embed .wrap { max-width: none; padding-inline: 0; padding-block: 4px 12px; }
</style>

<main class="wrap">
  <header>
    <p class="eyebrow"><b>Molis Work</b> · 第三幕「长」· 动画小样 <a href="#dev" data-persona="dev">写代码</a><a href="#doc" data-persona="doc">写文档、管事情</a></p>
    <h1>缺的工具，让 AI 做一个。</h1>
  </header>

  <div class="bar">
    <ol class="steps" id="steps" aria-label="这一幕的几步"></ol>
    <div class="tools">
      <button id="replay" class="ctrl">从头看</button>
      <button id="autoplay" class="ctrl" aria-pressed="true"><span class="dot" aria-hidden="true"></span><span class="ctrl-text">自动播放中</span></button>
    </div>
  </div>

  <section class="stage" id="stage">
    <div class="desk">
      <article class="sheet main">
        <header class="sheet-head"><span id="main-icon"></span><strong id="main-name"></strong><small id="main-sub"></small><span class="clock" id="clock"></span></header>
        <div class="main-body">
          <div class="view" data-view="builder">
            <div class="prompt" id="prompt"></div>
            <ol class="checks" id="checks"></ol>

    const s = stage.getBoundingClientRect();
    const r = el.getBoundingClientRect();
    return { x: r.left - s.left, y: r.top - s.top, w: r.width, h: r.height };
  }
  function cursorAt(x, y, dur) {
    cursor.style.transitionDuration = (instant ? 0 : dur) + 'ms';
    cursor.style.transform = `translate(${x - 3}px, ${y - 2}px)`;
    cur = { x, y };
  }
  async function moveTo(el, fx = 0.5, fy = 0.55) {
    const r = box(el);
    const x = r.x + r.w * fx;
    const y = r.y + r.h * fy;
    const dur = Math.min(760, Math.max(300, Math.hypot(x - cur.x, y - cur.y) * 1.05));
    cursorAt(x, y, dur);
    await sleep(dur + 60);
  }
  async function click(el) {
    if (instant) return;
    cursor.classList.add('down');
    if (el) el.classList.add('hit');
    const rp = document.createElement('span');
    rp.className = 'ripple';
    rp.style.left = cur.x + 'px';
    rp.style.top = cur.y + 'px';
    stage.appendChild(rp);
    setTimeout(() => rp.remove(), 540);
    await sleep(150);
    cursor.classList.remove('down');
    if (el) el.classList.remove('hit');
    await sleep(140);
  }

  function showBar(anchor, actions) {
    tb.innerHTML = actions.map((a) => `<span class="act${a.primary ? ' primary' : ''}"${a.id ? ` data-id="${a.id}"` : ''}>${a.icon ? svg(a.icon) : ''}${a.label}${a.tag ? `<span class="tag">${a.tag}</span>` : ''}</span>`).join('') + `<span class="div"></span><span class="ai">${svg('sparkles')}助理</span>`;
    const r = box(anchor);
    const W = stage.clientWidth;
    const w = tb.offsetWidth;
    const h = tb.offsetHeight;
    let left = r.x + r.w / 2 - w / 2;
    left = Math.max(8, Math.min(W - w - 8, left));
    let top = r.y - h - 8;
    if (top < 8) top = r.y + r.h + 8;
    tb.style.left = left + 'px';
    tb.style.top = top + 'px';
    tb.classList.add('on');
  }
  const hideBar = () => tb.classList.remove('on');
  const barItem = (id) => tb.querySelector(`[data-id="${id}"]`);
  function toast(html) { $('toast').innerHTML = html; $('toast').classList.add('on'); }

  function fly(fromEl, toEl, label) {
    if (instant || reduce) return Promise.resolve();
    const a = box(fromEl);
    const b = box(toEl);
    const f = document.createElement('div');
    f.className = 'flyer';
    f.textContent = label;
    f.style.left = a.x + 'px';
    f.style.top = a.y + 'px';
    stage.appendChild(f);
    const dx = b.x + b.w / 2 - (a.x + f.offsetWidth / 2);
    const dy = b.y + b.h / 2 - (a.y + f.offsetHeight / 2);
    const anim = f.animate([
      { transform: 'translate(0, 0) scale(1)', opacity: 1 },
      { transform: `translate(${dx * 0.5}px, ${dy * 0.5 - 50}px) scale(0.95)`, opacity: 1, offset: 0.5 },
      { transform: `translate(${dx}px, ${dy}px) scale(0.4)`, opacity: 0.2 },
    ], { duration: 860, easing: 'cubic-bezier(0.3, 0.7, 0.3, 1)' });
    // a background tab may never finish the animation; move on after its duration anyway
    return Promise.race([anim.finished, new Promise((r) => setTimeout(r, 1040))]).then(() => f.remove(), () => f.remove());
  }

  function setView(name, sub) {
    document.querySelectorAll('.view').forEach((v) => v.classList.toggle('on', v.dataset.view === name));
    const v = VIEWS[name];
    $('main-icon').innerHTML = svg(v.icon);
    $('main-name').textContent = v.name;
    $('main-sub').innerHTML = sub || (name === 'board' ? '<span class="yours-tag">你做的插件</span>' : v.sub);
  }
  async function typeInto(el, text, alive) {
    if (instant) { el.textContent = text; return; }
    const caret = document.createElement('span');
    caret.className = 'typing-caret';
    for (let i = 1; i <= text.length; i++) {
      if (!alive()) return;
      el.textContent = text.slice(0, i);
      el.appendChild(caret);
      await sleep(38);
    }
    await sleep(240);
    caret.remove();
  }
  function extLine(text, cls) {
    const d = document.createElement('div');
    d.className = cls;
    d.textContent = text;
    $('ext-lines').appendChild(d);
  }
  function pingDock(id) {
    const el = $(id);
    el.classList.remove('ping'); void el.offsetWidth; el.classList.add('ping');
  }
  function showItem(it) { it.hidden = false; it.classList.remove('new'); void it.offsetWidth; it.classList.add('new'); }

  function setStep(i) {
    stepBtns.forEach((b, k) => {
      b.classList.toggle('done', k < i);
      if (k === i) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current');
    });
    $('cap-kicker').textContent = `第 ${i + 1} 步，共 ${S.steps.length} 步`;
    $('cap-main').textContent = S.steps[i].main;
    $('cap-sub').textContent = S.steps[i].sub;
  }
  function setFinal() {
    stepBtns.forEach((b) => { b.classList.add('done'); b.removeAttribute('aria-current'); });
    $('cap-kicker').textContent = S.final.kicker;
    $('cap-main').textContent = S.final.main;
    $('cap-sub').textContent = S.final.sub;
  }

  // ---------- shared beats ----------
  async function makePlugin(alive) {
    setView('builder');
    $('clock').textContent = P === 'dev' ? '周二 15:40' : '周二 21:10';
    await sleep(400); if (!alive()) return;
    await moveTo($('prompt'), 0.2); if (!alive()) return;
    await click();
    await typeInto($('prompt'), S.prompt, alive); if (!alive()) return;
    for (const c of checks) {
      await sleep(600); if (!alive()) return;
      c.classList.add('on');
    }
    await sleep(400); if (!alive()) return;
    $('newtile').classList.add('on');
    await sleep(300); if (!alive()) return;
    $('dk-new').classList.add('on');
    await sleep(1500);
  }
  async function askExternal(alive) {
    $('ext-lines').innerHTML = '';
    $('ext').classList.add('on');
    for (const [text, cls] of S.ext.lines) {
      extLine(text, cls);
      await sleep(800); if (!alive()) return;
    }
    await sleep(1300);
  }
  async function saveFlow(alive) {
    setView('flow', '还没有流程');
    $('clock').textContent = P === 'dev' ? '周五 16:30' : '周日 19:40';
    await moveTo($('pill'), 0.3); if (!alive()) return;
    await click();
    $('pill').classList.add('typing');
    await typeInto($('pill-text'), F.ask, alive); if (!alive()) return;
    await moveTo($('pill').querySelector('.send')); if (!alive()) return;
    await click();
    $('pill').classList.remove('typing');
    $('pill-text').textContent = '让助理做点什么，或按 ⌘K 搜索';
    const p = box($('pill'));
    $('reply').style.left = Math.max(8, Math.min(stage.clientWidth - 410, p.x)) + 'px';
    $('reply').style.top = p.y - 82 + 'px';
    $('reply').classList.add('on');
    $('flow-empty').hidden = true;
    $('main-sub').textContent = F.name;
    for (const id of ['st1', 'c1', 'st2', 'c2', 'st3']) {
      await sleep(340); if (!alive()) return;
      $(id).classList.add('on');
    }
    await sleep(300); if (!alive()) return;
    $('sched').classList.add('on');
    pingDock('dk-flow');
    await sleep(1600); if (!alive()) return;
    $('reply').classList.remove('on');
    // the first run
    for (const [st, cn] of [['st1', 'c1'], ['st2', 'c2'], ['st3', null]]) {
      $(st).classList.add('lit');
      await sleep(380); if (!alive()) return;
      if (cn) { $(cn).classList.add('run'); await sleep(640); if (!alive()) return; }
    }
    $('res1').classList.add('on');
    await sleep(300); if (!alive()) return;
    $('res2').classList.add('on');
    await sleep(1500);
  }

  // ---------- the stories ----------
  const STEPS = {
    dev: [
      makePlugin,
      async (alive) => {
        setView('board');
        $('clock').textContent = '周四 18:10';
        await sleep(900); if (!alive()) return;
        $('gap').classList.remove('flash'); void $('gap').offsetWidth;
        await askExternal(alive); if (!alive()) return;
        $('gap').classList.add('flash');
        await sleep(900); if (!alive()) return;
        $('ext').classList.remove('on');
      },
      async (alive) => {
        $('clock').textContent = '周五 10:20';
        showItem(items[0]);
        showItem(items[1]);
        await sleep(800); if (!alive()) return;
        await moveTo(items[0].querySelector('.tick')); if (!alive()) return;
        await click();
        items[0].classList.add('on');
        showBar(items[0], [{ id: 'put', icon: S.plugin.icon, label: '放进发版清单', tag: '你做的', primary: true }, { icon: 'list-checks', label: '记成待办' }, { icon: 'terminal', label: '交给 Claude Code' }]);
        await sleep(1000); if (!alive()) return;
        await moveTo(barItem('put')); if (!alive()) return;
        await click(barItem('put'));
        hideBar();
        await fly(items[0], $('notes'), '#322 修好 Safari 14 付款后跳转');
        if (!alive()) return;
        const li = document.createElement('li');
        li.className = 'new';
        li.innerHTML = '修复：Safari 14 下付款后跳回订单页<small>PR #322</small>';
        $('notes').appendChild(li);
        toast(`${svg('check')}已放进发版清单 · 出处：PR #322`);
        await sleep(1900); if (!alive()) return;
        $('toast').classList.remove('on');
      },
      async (alive) => {
        items.forEach((i) => i.classList.remove('on'));
        await saveFlow(alive); if (!alive()) return;
        cursor.classList.add('hidden');
      },
    ],
    doc: [
      makePlugin,
      async (alive) => {
        setView('board');
        $('clock').textContent = '周三 09:15';
        showItem(items[0]);
        showItem(items[1]);
        await sleep(800); if (!alive()) return;
        await moveTo(items[0].querySelector('.tick')); if (!alive()) return;
        await click();
        items[0].classList.add('on');
        showBar(items[0], [{ id: 'put', icon: S.plugin.icon, label: '放进选题库', tag: '你做的', primary: true }, { icon: 'lightbulb', label: '记下灵光' }, { icon: 'list-checks', label: '记成待办' }]);
        await sleep(1000); if (!alive()) return;
        await moveTo(barItem('put')); if (!alive()) return;
        await click(barItem('put'));
        hideBar();
        await fly(items[0], $('rows'), '读者留言：想看几家 AI 编辑器横评');
        if (!alive()) return;
        const tr = document.createElement('tr');
        tr.className = 'new';
        tr.innerHTML = '<td>几家 AI 编辑器横评</td><td><small>读者留言</small></td><td class="heat">●●●</td><td><span class="st">没写</span></td>';
        $('rows').insertBefore(tr, $('rows').children[1]);
        $('board-foot').textContent = '共 5 个选题 · 4 个没写';
        toast(`${svg('check')}已放进选题库 · 来源：读者留言`);
        await sleep(1900); if (!alive()) return;
        $('toast').classList.remove('on');
      },
      async (alive) => {
        items.forEach((i) => i.classList.remove('on'));
        await saveFlow(alive);
      },
      async (alive) => {
        $('clock').textContent = '周一 09:00';
        cursor.classList.add('hidden');
        await askExternal(alive); if (!alive()) return;
        await sleep(400);
      },
    ],
  };
  const steps = STEPS[P];

  function reset() {
    setView('builder');
    $('clock').textContent = '';
    $('prompt').textContent = '';
    checks.forEach((c) => c.classList.remove('on'));
    ['newtile', 'dk-new', 'reply', 'toast', 'ext', 'sched', 'res1', 'res2'].forEach((id) => $(id).classList.remove('on'));
    ['st1', 'st2', 'st3', 'c1', 'c2'].forEach((id) => $(id).classList.remove('on', 'lit', 'run'));
    $('flow-empty').hidden = false;
    items.forEach((i) => { i.classList.remove('on', 'new'); i.hidden = true; });
    $('board').innerHTML = $('board-' + P).innerHTML;
    $('board').querySelectorAll('[data-icon]').forEach((el) => el.insertAdjacentHTML('afterbegin', svg(el.dataset.icon)));
    $('ext-lines').innerHTML = '';
    $('pill').classList.remove('typing');
    $('pill-text').textContent = '让助理做点什么，或按 ⌘K 搜索';
    hideBar();
    stage.querySelectorAll('.flyer, .ripple').forEach((n) => n.remove());
    cursor.classList.toggle('hidden', reduce);
    const saved = instant;
    instant = true;
    cursorAt(stage.clientWidth - 90, stage.clientHeight - 70, 0);
    instant = saved;
  }

  async function play(fromStep = 0) {
    const id = ++runId;
    const alive = () => id === runId;
    setInstant(fromStep > 0 || reduce);
    reset();
    for (let k = 0; k < steps.length; k++) {
      if (fromStep === k && !reduce) setInstant(false);
      if (!instant) setStep(k);
      await steps[k](alive);
      if (!alive()) return;
    }
    if (fromStep >= steps.length || reduce) { setInstant(false); setFinal(); cursor.classList.add('hidden'); return; }
    setInstant(false);
    setFinal();
    await sleep(4500); if (!alive()) return;
    if (autoplay) play(0);
  }

  // ---------- controls ----------
  stepBtns.forEach((b) => b.addEventListener('click', () => play(Number(b.dataset.step))));
  $('replay').addEventListener('click', () => play(0));
  function syncAuto() {
    autoBtn.setAttribute('aria-pressed', String(autoplay));
    autoBtn.querySelector('.ctrl-text').textContent = autoplay ? '自动播放中' : '自动播放已停';
  }
  autoBtn.addEventListener('click', () => { autoplay = !autoplay; syncAuto(); if (autoplay) play(0); });
  syncAuto();

  // a complete resting frame (the grown workbench), then play from the start
  play(steps.length);
  if (EMBED) embed(() => play(0), (on) => { autoplay = on; syncAuto(); });
  else if (!reduce) setTimeout(() => { if (runId === 1) play(0); }, 1400);
})();
</script>

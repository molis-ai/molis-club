<title>Molis Work 一起干小样</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@1,6..72,400&family=Noto+Serif+SC:wght@500;700&display=swap">
<style>
/* Layout: three paper sheets on one stage with the project thread in the middle. Code: user feedback in Feed on the left, the goal on the right. Writing and managing: the goal waiting on a decision on the left, the work it touches on the right. Things fly between sheets as the work moves on. */
:root {
  --paper: #f5f0e6;
  --sheet: #fffcf6;
  --ink: #121826;
  --text: #33312c;
  --muted: #6f695f;
  --faint: #a39d92;
  --line: rgb(18 24 38 / 0.12);
  --red: #ee4e2b;
  --red-soft: #fbe0d8;
  --amber: #c98a12;
  --amber-soft: #fbefd2;
  --sage: #8fb69b;
  --sage-soft: #e3eee5;
  --sage-deep: #2f6b45;
  --yellow: #f6c445;
  --pink: #f4b4c0;
  --peri: #b9c6f5;
  --cx: #b9c6f5;
  --cc: #e8a28c;
  --term: #151b29;
  --term-text: #e8e3d8;
  --term-muted: #8d93a3;
  --serif: 'Noto Serif SC', 'Songti SC', 'STSong', serif;
  --display: 'Newsreader', Georgia, serif;
  --sans: 'Geist', 'PingFang SC', 'Hiragino Sans GB', system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, 'PingFang SC', monospace;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  --snap: cubic-bezier(0.34, 1.4, 0.5, 1);
  --shadow: 0 18px 34px -24px rgb(40 24 10 / 0.55), 0 1px 0 rgb(18 24 38 / 0.05);
  color-scheme: light;
}
body { background: var(--paper); color: var(--text); font-family: var(--sans); }
[hidden] { display: none !important; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: clamp(16px, 3.2vw, 48px); padding-block: clamp(28px, 5vw, 64px) 48px; display: grid; gap: 22px; }
.eyebrow { margin: 0; font-size: 12px; letter-spacing: 0.08em; color: var(--muted); }
.eyebrow b { color: var(--red); font-weight: 500; }
.eyebrow a { margin-left: 8px; color: var(--muted); }
.eyebrow a.on { color: var(--ink); font-weight: 500; }
h1 { margin: 6px 0 0; font-family: var(--serif); font-weight: 700; color: var(--ink); font-size: clamp(30px, 4.6vw, 54px); line-height: 1.15; letter-spacing: -0.01em; text-wrap: balance; }

.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.steps { display: flex; flex-wrap: wrap; gap: 4px; margin: 0; padding: 0; list-style: none; }
.steps button { display: inline-flex; align-items: center; gap: 8px; font: 500 14px/1 var(--sans); color: var(--muted); background: transparent; border: 0; border-radius: 999px; padding: 9px 13px 9px 9px; cursor: pointer; transition: background 160ms var(--ease), color 160ms var(--ease); }
.steps button:hover { background: rgb(18 24 38 / 0.06); }
.steps .n { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; font-size: 11px; background: rgb(18 24 38 / 0.07); color: var(--muted); transition: background 200ms var(--ease), color 200ms var(--ease); }
.steps button.done { color: var(--text); }
.steps button.done .n { background: var(--sage); color: var(--sheet); }
.steps button[aria-current="step"] { color: var(--ink); background: rgb(18 24 38 / 0.06); }
.steps button[aria-current="step"] .n { background: var(--red); color: var(--sheet); }
.tools { display: flex; gap: 4px; }
.ctrl { display: inline-flex; align-items: center; gap: 8px; font: 500 14px/1 var(--sans); color: var(--muted); background: transparent; border: 0; border-radius: 999px; padding: 10px 14px; cursor: pointer; }
.ctrl:hover { background: rgb(18 24 38 / 0.06); }
.ctrl .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
.ctrl[aria-pressed="false"] .dot { background: transparent; box-shadow: inset 0 0 0 1.5px var(--muted); }
button:focus-visible { outline: 2px solid var(--red); outline-offset: 3px; }
svg.i { width: 15px; height: 15px; flex: none; }

.stage { position: relative; display: grid; grid-template-columns: 1fr 1.3fr 0.95fr; gap: 16px; padding: 18px; height: 640px; border-radius: 22px; background: #efe8db; box-shadow: inset 0 0 0 1px rgb(18 24 38 / 0.04); }
.sheet { position: relative; min-width: 0; display: flex; flex-direction: column; background: var(--sheet); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
.sheet-head { display: flex; align-items: center; gap: 9px; padding: 14px 16px 12px; border-bottom: 1px solid var(--line); }
.sheet-head svg { width: 17px; height: 17px; color: var(--ink); flex: none; }
.sheet-head strong { font-size: 14px; font-weight: 600; color: var(--ink); }
.sheet-head small { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sheet-body { position: relative; flex: 1; min-height: 0; padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
/* never squeeze a message or card; overflow leaves from the top of the thread instead */
.sheet-body > * { flex-shrink: 0; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* feed */
.scanner { display: inline-flex; align-items: center; gap: 7px; align-self: flex-start; padding: 5px 10px 5px 8px; border-radius: 999px; background: var(--red-soft); color: #9c2f14; font-size: 12px; opacity: 0; transform: translateY(4px); transition: opacity 300ms var(--ease), transform 300ms var(--ease); }
.scanner.on { opacity: 1; transform: none; }
.fi { display: grid; grid-template-columns: 18px 1fr; gap: 8px; padding: 8px 10px; border-radius: 10px; background: var(--paper); font-size: 12.5px; line-height: 1.5; transition: box-shadow 300ms var(--ease), opacity 300ms var(--ease); }
.fi.in { animation: rise 380ms var(--ease); }
.fi svg { width: 14px; height: 14px; margin-top: 2px; color: var(--muted); }
.fi b { display: block; font-size: 11.5px; font-weight: 500; color: var(--muted); }
.fi span { color: var(--ink); }
.fi.hot { box-shadow: inset 0 0 0 1.5px var(--red); }
.fi.quiet { opacity: 0.45; }
.judge { margin-top: auto; padding: 11px 12px; border-radius: 12px; background: var(--sheet); box-shadow: 0 0 0 1.5px var(--red), 0 16px 28px -22px rgb(150 40 10 / 0.6); font-size: 12.5px; line-height: 1.55; opacity: 0; transform: translateY(8px); transition: opacity 360ms var(--ease), transform 420ms var(--snap); }
.judge.on { opacity: 1; transform: none; }
.judge b { display: flex; align-items: center; gap: 6px; color: #9c2f14; font-size: 13px; }
.judge b svg { width: 14px; height: 14px; }
.judge small { display: block; margin-top: 3px; color: var(--muted); font-size: 11.5px; }

/* thread */
.thread .sheet-body { justify-content: flex-end; gap: 11px; padding-top: 0; }
.thread .sheet-body::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 40px; background: linear-gradient(var(--sheet), transparent); z-index: 1; pointer-events: none; }
.people { margin-left: auto; display: flex; }
.people span { width: 22px; height: 22px; margin-left: -6px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 600; color: var(--ink); box-shadow: 0 0 0 2px var(--sheet); }
.people svg { width: 12px; height: 12px; color: var(--sheet); }
.msg { display: grid; grid-template-columns: 28px 1fr; gap: 9px; align-items: start; font-size: 13px; line-height: 1.6; animation: rise 420ms var(--ease); }
.msg.pending { visibility: hidden; animation: none; }
.av { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 11.5px; font-weight: 600; color: var(--ink); flex: none; }
.av svg { width: 15px; height: 15px; color: var(--sheet); }
.who { display: flex; align-items: baseline; gap: 6px; font-size: 12px; color: var(--muted); }
.who b { font-size: 12.5px; font-weight: 600; color: var(--ink); }
.who .tag { font-size: 11px; color: #9c2f14; }
.bubble { margin-top: 2px; color: var(--text); }
.at { color: var(--red); font-weight: 500; border-radius: 4px; padding: 0 2px; transition: background 300ms var(--ease); }
.at.ping { background: var(--red-soft); }
.post { margin-top: 6px; padding: 10px 12px; border-radius: 10px; background: var(--paper); font-size: 12.5px; line-height: 1.6; }
.post b { color: var(--ink); }
.quotes { display: grid; gap: 4px; margin-top: 6px; }
.quotes span { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); }
.quotes svg { width: 12px; height: 12px; }
.links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
.link { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 999px; background: var(--sheet); font-size: 11.5px; color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
.link svg { width: 12px; height: 12px; }
.memory { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; padding: 4px 9px; border-radius: 999px; background: #f1ecff; color: #463a8a; font-size: 11.5px; }
.memory svg { width: 13px; height: 13px; }
.reqlist { margin: 6px 0 0; padding-left: 1.2em; font-size: 12.5px; }
.btns { display: flex; gap: 6px; margin-top: 8px; }
.btn { font: 500 12.5px/1 var(--sans); border: 0; border-radius: 8px; padding: 8px 12px; background: var(--ink); color: var(--sheet); transition: transform 130ms var(--ease), background 200ms var(--ease), opacity 200ms var(--ease); }
.btn.ghost { background: var(--sheet); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
.btn.hit { transform: scale(0.95); }
.btn.picked { background: var(--red); color: var(--sheet); box-shadow: none; }
.btns.done .btn:not(.picked) { opacity: 0.35; }
.prog { margin-top: 6px; padding: 9px 11px; border-radius: 10px; background: var(--term); color: var(--term-text); font: 12px/1.6 var(--mono); }
.prog .ok { color: #9be0ae; }
.prog .o { color: var(--term-muted); }

/* goal sheets */
.empty { margin: 0; font-size: 12.5px; color: var(--faint); }
.goal-in { display: none; flex-direction: column; gap: 8px; }
.goal-in.on { display: flex; animation: rise 420ms var(--ease); }
.g-title { margin: 0; font-family: var(--serif); font-size: 18px; font-weight: 700; color: var(--ink); line-height: 1.35; }
.g-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: 12px; color: var(--muted); }
.pill { padding: 2px 8px; border-radius: 999px; background: var(--red-soft); color: #9c2f14; font-size: 11.5px; white-space: nowrap; }
.pill.wait { background: var(--amber-soft); color: #7a520a; }
.pill.done { background: var(--sage-soft); color: var(--sage-deep); }
.bind { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 6px; background: var(--term); color: var(--term-text); font-size: 11px; }
.bind svg { width: 11px; height: 11px; }
.g-h { margin: 4px 0 0; font-size: 11.5px; font-weight: 500; color: var(--muted); letter-spacing: 0.04em; }
.reqs { margin: 0; padding: 0; list-style: none; display: grid; gap: 5px; }
.req { display: grid; grid-template-columns: 18px 1fr; gap: 8px; align-items: start; padding: 5px 8px; border-radius: 9px; font-size: 12.5px; line-height: 1.5; transition: background 400ms var(--ease); }
.req .mk { display: grid; place-items: center; width: 16px; height: 16px; margin-top: 2px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--faint); transition: background 300ms var(--ease), box-shadow 300ms var(--ease); }
.req .mk svg { width: 11px; height: 11px; color: var(--sheet); opacity: 0; }
.req.done .mk { background: var(--sage); box-shadow: none; }
.req.done .mk svg { opacity: 1; }
.req.flash { background: rgb(143 182 155 / 0.2); }
.req b { font-weight: 500; color: var(--ink); }
.must { margin-left: 6px; padding: 1px 6px; border-radius: 5px; background: var(--paper); font-size: 11px; color: var(--muted); white-space: nowrap; }
.ev { display: none; font-size: 11.5px; color: var(--sage-deep); }
.ev.on { display: block; }
.decision { padding: 11px 12px; border-radius: 12px; background: var(--sheet); box-shadow: 0 0 0 1.5px var(--amber), 0 16px 30px -22px rgb(40 24 10 / 0.6); opacity: 0; transform: translateY(8px); transition: opacity 360ms var(--ease), transform 420ms var(--snap), box-shadow 400ms var(--ease); }
.decision.on { opacity: 1; transform: none; }
.decision.settled { box-shadow: 0 0 0 1.5px var(--sage), 0 16px 30px -22px rgb(40 24 10 / 0.4); }
.dc-h { display: flex; align-items: center; gap: 7px; margin-bottom: 6px; font-size: 12px; color: var(--muted); }
.dc-h b { color: var(--ink); font-size: 13px; }
.dc-h .tag { margin-left: auto; padding: 1px 7px; border-radius: 6px; background: var(--amber-soft); color: #7a520a; font-size: 11px; transition: background 300ms var(--ease), color 300ms var(--ease); }
.decision.settled .tag { background: var(--sage-soft); color: var(--sage-deep); }
.choice { display: grid; grid-template-columns: 22px 1fr; gap: 8px; padding: 7px 8px; border-radius: 9px; font-size: 12.5px; line-height: 1.5; transition: background 300ms var(--ease), opacity 300ms var(--ease); }
.choice i { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 6px; background: var(--paper); font-style: normal; font-weight: 600; font-size: 11px; color: var(--ink); }
.choice b { display: block; font-weight: 500; color: var(--ink); }
.choice small { display: block; color: #7a520a; font-size: 11.5px; }
.choice.picked { background: var(--sage-soft); }
.choice.picked i { background: var(--sage-deep); color: var(--sheet); }
.choice.out { opacity: 0.45; }
.agree { display: none; align-items: center; gap: 6px; margin-top: 6px; font-size: 12px; color: var(--sage-deep); }
.agree.on { display: flex; animation: rise 360ms var(--ease); }
.agree svg { width: 13px; height: 13px; }
.mini-goal { padding: 10px 11px; border-radius: 11px; background: var(--paper); font-size: 12.5px; line-height: 1.55; transition: box-shadow 400ms var(--ease); }
.mini-goal .top { display: flex; align-items: center; gap: 7px; }
.mini-goal .top svg { width: 14px; height: 14px; color: var(--muted); }
.mini-goal .top b { color: var(--ink); font-weight: 600; }
.mini-goal .top .pill { margin-left: auto; }
.mini-goal small { display: block; margin-top: 2px; color: var(--muted); font-size: 11.5px; }
.change { display: none; margin-top: 6px; padding: 5px 8px; border-radius: 8px; background: var(--amber-soft); color: #7a520a; font-size: 12px; }
.change.on { display: block; animation: rise 360ms var(--ease); }
.mini-goal.hit { box-shadow: 0 0 0 1.5px var(--amber); }
.agent-line { display: none; margin-top: 6px; padding: 6px 9px; border-radius: 8px; background: var(--term); color: var(--term-text); font: 11.5px/1.55 var(--mono); }
.agent-line.on { display: block; animation: rise 360ms var(--ease); }
.agent-line em { font-style: normal; color: #9be0ae; }
.todo-h { margin: 6px 0 0; font-size: 11.5px; font-weight: 500; color: var(--muted); letter-spacing: 0.04em; }
.item { display: grid; grid-template-columns: 18px 1fr; gap: 9px; padding: 9px 11px; border-radius: 11px; background: var(--paper); font-size: 12.5px; line-height: 1.5; }
.item.pending { visibility: hidden; }
.item.in { animation: rise 380ms var(--ease); }
.item .box { width: 15px; height: 15px; margin-top: 2px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--faint); }
.item b { display: block; font-weight: 500; color: var(--ink); }
.item .meta { display: flex; align-items: center; gap: 6px; margin-top: 3px; font-size: 11.5px; color: var(--muted); }
.item .meta .av { width: 18px; height: 18px; font-size: 9.5px; }

.flying { position: absolute; z-index: 20; transform-origin: 0 0; pointer-events: none; box-shadow: 0 20px 34px -18px rgb(40 24 10 / 0.6); }
.packet { position: absolute; z-index: 20; display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; background: var(--red); color: var(--sheet); font-size: 12px; font-weight: 500; white-space: nowrap; box-shadow: 0 14px 24px -14px rgb(150 40 10 / 0.8); pointer-events: none; }
.packet svg { width: 13px; height: 13px; }
.packet.read { background: var(--ink); }
.cursor { position: absolute; top: 0; left: 0; z-index: 30; width: 22px; height: 24px; pointer-events: none; transition-property: transform; transition-timing-function: var(--ease); }
.cursor svg { display: block; width: 22px; height: 24px; filter: drop-shadow(0 2px 3px rgb(0 0 0 / 0.25)); transition: transform 110ms var(--ease); transform-origin: 3px 2px; }
.cursor.down svg { transform: scale(0.84); }
.cursor.hidden { display: none; }
.ripple { position: absolute; z-index: 29; width: 26px; height: 26px; margin: -11px 0 0 -11px; border-radius: 50%; border: 2px solid var(--red); pointer-events: none; animation: ripple 520ms var(--ease) forwards; }
@keyframes ripple { from { transform: scale(0.3); opacity: 0.9; } to { transform: scale(1.4); opacity: 0; } }

/* room for a two-line explanation, so the frame does not change height between steps */
.caption { display: grid; gap: 6px; align-content: start; min-height: 132px; }
.cap-kicker { margin: 0; font-size: 12px; letter-spacing: 0.08em; color: var(--red); }
.cap-main { margin: 0; font-family: var(--serif); font-weight: 700; font-size: clamp(22px, 2.6vw, 30px); color: var(--ink); }
.cap-sub { margin: 0; max-width: 46em; font-size: 15px; line-height: 1.8; }
.foot-note { margin: 0; font-size: 12.5px; color: var(--muted); line-height: 1.7; border-top: 1px solid var(--line); padding-top: 14px; }

@media (max-width: 900px) {
  .stage { grid-template-columns: 1fr; height: auto; padding: 12px; gap: 12px; }
  .thread { height: 520px; }
  .sheet:not(.thread) .sheet-body { min-height: 220px; }
}
/* while skipping ahead to a step, everything lands at once */
.stage.jump *, .stage.jump *::before, .stage.jump *::after { transition: none !important; animation: none !important; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
html.embed .wrap > header, html.embed .foot-note { display: none; }
html.embed .wrap { max-width: none; padding-inline: 0; padding-block: 4px 12px; }
</style>

<main class="wrap">
  <header>
    <p class="eyebrow"><b>Molis Work</b> · 接下来 · 一起干 · 动画小样 <a href="#dev" data-persona="dev">写代码</a><a href="#doc" data-persona="doc">写文档、管事情</a></p>
    <h1>一个人的工作台，接上一个团队。</h1>
  </header>

  <div class="bar">
    <ol class="steps" id="steps" aria-label="这一幕的几步"></ol>
    <div class="tools">
      <button id="replay" class="ctrl">从头看</button>
      <button id="autoplay" class="ctrl" aria-pressed="true"><span class="dot" aria-hidden="true"></span><span class="ctrl-text">自动播放中</span></button>
    </div>
  </div>

  <section class="stage" id="stage"></section>

  <div class="caption" aria-live="polite">
    <p class="cap-kicker" id="cap-kicker"></p>
    <p class="cap-main" id="cap-main"></p>
    <p class="cap-sub" id="cap-sub"></p>
  </div>

  <p class="foot-note" id="foot-note"></p>
</main>

<!-- code: user feedback comes into Feed, the assistant judges it and calls the people, the thread turns it into a goal, your Codex fixes it, the PM accepts -->
<template id="stage-dev">
  <article class="sheet">
    <header class="sheet-head"><span data-icon="rss"></span><strong>Feed</strong><small>用户反馈 · 3 个来源</small></header>
    <div class="sheet-body" id="feed">
      <span class="scanner" id="scanner"><span data-icon="sparkles"></span>助理按你定的规则在看</span>
      <div id="fis"></div>
      <div class="judge" id="judge"><b><span data-icon="circle-alert"></span>高优先：支付失败，影响 23 位用户</b><small>规则：涉及付款、影响超过 10 人 → 发到项目群，@ 负责人和产品</small></div>
    </div>
  </article>

  <article class="sheet thread">
    <header class="sheet-head"><span data-icon="messages-square"></span><strong>讨论</strong><small># 支付失败</small>
      <span class="people"><span style="background: var(--ink); color: var(--sheet)">你</span><span style="background: var(--yellow)">周</span><span style="background: var(--red)" data-icon="sparkles"></span></span>
    </header>
    <div class="sheet-body" id="thread"></div>
  </article>

  <article class="sheet">
    <header class="sheet-head"><span data-icon="target"></span><strong>Goals</strong><small>支付改版</small></header>
    <div class="sheet-body">
      <p class="empty" id="g-empty">还没有目标。</p>
      <div class="goal-in" id="goal">
        <h3 class="g-title">修好微信内置浏览器里的支付</h3>
        <div class="g-meta"><span class="pill" id="g-state">进行中</span><span class="bind"><span data-icon="terminal"></span>Codex · 你的终端</span></div>
        <p class="g-h">完成要求 <b id="g-count">0/3</b></p>
        <ul class="reqs">

      ['ch-a', 'ch-b'].forEach((c) => $(c).classList.remove('picked', 'out'));

      ['mg1', 'mg2'].forEach((id) => $(id).classList.remove('hit'));
      $('todos').innerHTML = '';
      $('todo-empty').hidden = false;
      setPill('g-state', '进行中');
    },
  };
  const STEPS = {
    dev: [
      async (alive) => {
        for (let i = 0; i < FEED.length; i++) {
          const el = $('fi' + i);
          el.hidden = false;
          el.classList.add('in');
          await sleep(520); if (!alive()) return;
        }
        $('scanner').classList.add('on');
        await sleep(900); if (!alive()) return;
        FEED.forEach((f, i) => $('fi' + i).classList.add(f.hot ? 'hot' : 'quiet'));
        await sleep(700); if (!alive()) return;
        $('judge').classList.add('on');
        await sleep(1800);
      },
      async (alive) => {
        const post = message('ai', `<span class="at">@你</span> <span class="at">@小周</span> 高优先：支付失败，影响 23 位用户<div class="post"><b>用户原话</b><div class="quotes"><span>${svg('star')}付完钱一直转圈，订单没出来</span><span>${svg('mail')}3 个店员在微信里都付不了款</span><span>${svg('github')}#331 iOS 微信内置浏览器回调失败</span></div><div class="links"><span class="link">${svg('target')}有关目标：上线支付</span></div></div>`, true);
        await fly($('judge'), post.querySelector('.post'), 820);
        if (!alive()) return;
        post.classList.remove('pending');
        await pingAts(post, alive); if (!alive()) return;
        await sleep(1800);
      },
      async (alive) => {
        message('zhou', '先修微信内置浏览器，iOS 用户最多。');
        await sleep(1100); if (!alive()) return;
        message('ai', `7 月有过一次类似的：回调地址没走 https。<div><span class="memory">${svg('history')}项目记忆 · 7 月支付回调复盘</span></div>`);
        await sleep(1500); if (!alive()) return;
        message('ai', `提成一个目标？<div class="post"><b>修好微信内置浏览器里的支付</b><ol class="reqlist"><li>微信内置浏览器里能付款</li><li>23 位用户的订单补上</li><li>真机上走一遍（小周验收）</li></ol><div class="btns" id="prop-btns"><button class="btn" id="prop-ok" tabindex="-1">同意，建目标</button><button class="btn ghost" tabindex="-1">再想想</button></div></div>`);
        await sleep(1200); if (!alive()) return;
        await moveTo($('prop-ok')); if (!alive()) return;
        await click($('prop-ok'));
        $('prop-ok').classList.add('picked');
        $('prop-btns').classList.add('done');
        cursor.classList.add('hidden');
        await packet($('prop-ok'), $('g-empty'), '建目标'); if (!alive()) return;
        $('g-empty').hidden = true;
        $('goal').classList.add('on');
        await sleep(1200);
      },
      async (alive) => {
        message('me', '交给我的 Codex。');
        await sleep(800); if (!alive()) return;
        const prog = message('ai', `<div class="prog"><span class="o">Codex 读到目标，开工了</span></div>`);
        const pr = prog.querySelector('.prog');
        await sleep(1000); if (!alive()) return;
        pr.insertAdjacentHTML('beforeend', '<br><span class="ok">✓ 回调改走 https · 测试 16/16</span>');
        await packet(pr, $('r1'), '交依据'); if (!alive()) return;
        check('r1', 'e1', '1/3');
        await sleep(600); if (!alive()) return;
        pr.insertAdjacentHTML('beforeend', '<br><span class="ok">✓ 补单脚本跑完 · 23/23</span>');
        await packet(pr, $('r2'), '交依据'); if (!alive()) return;
        check('r2', 'e2', '2/3');
        await sleep(600); if (!alive()) return;
        pr.insertAdjacentHTML('beforeend', '<br><span class="o">还差：真机上走一遍，等 <span class="at">@小周</span> 验收</span>');
        await sleep(1500);
      },
      async (alive) => {
        message('zhou', `录屏看了，iOS 和安卓都好了。<div class="btns" id="acc-btns"><button class="btn" id="acc-ok" tabindex="-1">验收通过</button></div>`);
        await sleep(900); if (!alive()) return;
        await moveTo($('acc-ok')); if (!alive()) return;
        await click($('acc-ok'));
        $('acc-ok').classList.add('picked');
        cursor.classList.add('hidden');
        await packet($('acc-ok'), $('r3'), '验收'); if (!alive()) return;
        check('r3', 'e3', '3/3');
        setPill('g-state', '完成', 'done');
        await sleep(1400);
      },
    ],
    doc: [
      async (alive) => {
        await sleep(400); if (!alive()) return;
        $('decision').classList.add('on');
        setPill('g-state', '等你决定', 'wait');
        await sleep(2200);
      },
      async (alive) => {
        const post = message('ai', `<span class="at">@你</span> <span class="at">@小林</span> 订阅上线卡在定价，要你们定：<div class="post"><b>A 要多做一周，B 会影响 1,200 位老用户</b><div class="links"><span class="link">${svg('target')}会员订阅上线 · 待你决定</span><span class="link">${svg('file-text')}定价方案</span></div></div>`, true);
        await fly($('decision'), post.querySelector('.post'), 820);
        if (!alive()) return;
        post.classList.remove('pending');
        await pingAts(post, alive); if (!alive()) return;
        await sleep(1700);
      },
      async (alive) => {
        message('lin', 'B 我能接住，提前一个月通知老用户。');
        await sleep(1200); if (!alive()) return;
        message('zhe', '选 B 的话，这周就能上。');
        await sleep(1100); if (!alive()) return;
        message('me', `那就 B。<div class="btns" id="pick-btns"><button class="btn ghost" tabindex="-1">选 A</button><button class="btn ghost" id="pick-b" tabindex="-1">选 B</button></div>`);
        await sleep(700); if (!alive()) return;
        await moveTo($('pick-b')); if (!alive()) return;
        await click($('pick-b'));
        $('pick-b').classList.add('picked');
        $('pick-btns').classList.add('done');
        cursor.classList.add('hidden');
        await packet($('pick-b'), $('decision'), '定了：B'); if (!alive()) return;
        $('ch-b').classList.add('picked');
        $('ch-a').classList.add('out');
        $('decision').classList.add('settled');
        $('dc-tag').textContent = '已定';
        $('agree').classList.add('on');
        setPill('g-state', '进行中');
        await sleep(1200);
      },
      async (alive) => {
        await packet($('decision'), $('mg1'), '新约定'); if (!alive()) return;
        $('mg1').classList.add('hit');
        $('chg1').classList.add('on');
        await sleep(500); if (!alive()) return;
        await packet($('decision'), $('mg2'), '新约定'); if (!alive()) return;
        $('mg2').classList.add('hit');
        $('chg2').classList.add('on');
        await sleep(700); if (!alive()) return;
        $('agent').classList.add('on');
        await sleep(900); if (!alive()) return;
        const item = document.createElement('div');
        item.className = 'item in';
        item.innerHTML = `<span class="box"></span><div><b>通知老用户：下月起按新价</b><div class="meta">${avatar('lin')}<span>小林 · 下周一前 · 来自 # 订阅定价</span></div></div>`;
        $('todo-empty').hidden = true;
        $('todos').appendChild(item);
        await sleep(1600);
      },
    ],
  };
  const steps = STEPS[P];

  function reset() {
    thread.innerHTML = '';
    RESET[P]();
    stage.querySelectorAll('.flying, .packet, .ripple').forEach((g) => g.remove());
    cursor.classList.add('hidden');
    const saved = instant;
    instant = true;
    cursorAt(stage.clientWidth / 2, stage.clientHeight - 40, 0);
    instant = saved;
  }

  async function play(fromStep = 0) {
    const id = ++runId;
    const alive = () => id === runId;
    setInstant(fromStep > 0 || reduce);
    reset();
    for (let k = 0; k < steps.length; k++) {
      if (fromStep === k && !reduce) setInstant(false);
      if (!instant) setStep(k);
      await steps[k](alive);
      if (!alive()) return;
    }
    if (fromStep >= steps.length || reduce) { setInstant(false); setFinal(); cursor.classList.add('hidden'); return; }
    setInstant(false);
    setFinal();
    await sleep(4500); if (!alive()) return;
    if (autoplay) play(0);
  }

  // ---------- controls ----------
  stepBtns.forEach((b) => b.addEventListener('click', () => play(Number(b.dataset.step))));
  $('replay').addEventListener('click', () => play(0));
  function syncAuto() {
    autoBtn.setAttribute('aria-pressed', String(autoplay));
    autoBtn.querySelector('.ctrl-text').textContent = autoplay ? '自动播放中' : '自动播放已停';
  }
  autoBtn.addEventListener('click', () => { autoplay = !autoplay; syncAuto(); if (autoplay) play(0); });
  syncAuto();

  // a complete resting frame (the finished story), then play from the start
  play(steps.length);
  if (EMBED) embed(() => play(0), (on) => { autoplay = on; syncAuto(); });
  else if (!reduce) setTimeout(() => { if (runId === 1) play(0); }, 1400);
})();
</script>

<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 508' width='760' height='508' font-family='-apple-system, "PingFang SC", "Noto Sans SC", sans-serif' role='img' aria-label='屏不动，框和一句话只在要点的地方，点了 App 自己变' font-size='13'><defs><marker id='frame-arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#8d8e90' /></marker></defs><rect width='760' height='508' rx='12' fill='#ffffff' /><text x='24' y='28' font-size='15' font-weight='600' fill='#292a2c'>屏不动，框和一句话只在要点的地方，点了 App 自己变</text><g><rect x='24' y='48' width='492' height='288' rx='10' fill='none' stroke='#8d8e90' /><rect x='36' y='58' width='48' height='20' rx='5' fill='none' stroke='#d9dad7' /><text x='60' y='72' font-size='11.5' text-anchor='middle' fill='#6b6c6f'>首页</text><rect x='90' y='58' width='72' height='20' rx='5' fill='#e9eff8' stroke='#8d8e90' /><text x='126' y='72' font-size='11.5' font-weight='600' text-anchor='middle' fill='#292a2c'>用户反馈</text><text x='176' y='72' font-size='13' fill='#6b6c6f'>+</text></g><g><rect x='36' y='86' width='296' height='204' rx='8' fill='none' stroke='#d9dad7' /><text x='50' y='108' font-weight='600' fill='#292a2c'>Feed</text><rect x='46' y='118' width='276' height='32' rx='6' fill='#3f6fb0' fill-opacity='0.12' stroke='#3f6fb0' stroke-width='2' /><text x='58' y='138' font-size='12' fill='#292a2c'>下单付不了款</text><rect x='58' y='158' width='130' height='24' rx='6' fill='none' stroke='#8d8e90' /><text x='123' y='174' font-size='11.5' text-anchor='middle' fill='#292a2c'>3 条都在说付不了款</text><rect x='58' y='198' width='180' height='8' rx='4' fill='#d9dad7' /><rect x='58' y='222' width='220' height='8' rx='4' fill='#d9dad7' /><rect x='58' y='246' width='150' height='8' rx='4' fill='#d9dad7' /><rect x='58' y='270' width='200' height='8' rx='4' fill='#d9dad7' /></g><g><path d='M296 126L296 146L301 141L305 149L308 148L304 140L311 140Z' fill='#292a2c' /><rect x='300' y='150' width='24' height='18' rx='9' fill='#3f6fb0' fill-opacity='0.12' stroke='#3f6fb0' /><text x='312' y='163' font-size='11.5' text-anchor='middle' fill='#292a2c'>你</text></g><g><rect x='342' y='86' width='162' height='204' rx='8' fill='none' stroke='#d9dad7' /><text x='356' y='108' font-weight='600' fill='#292a2c'>项目讨论</text><text x='356' y='130' font-size='11.5' fill='#6b6c6f'>小周</text><rect x='356' y='138' width='120' height='8' rx='4' fill='#d9dad7' /><text x='356' y='164' font-size='11.5' fill='#6b6c6f'>阿哲</text><rect x='356' y='172' width='136' height='8' rx='4' fill='#d9dad7' /><text x='356' y='198' font-size='11.5' fill='#6b6c6f'>助理</text><rect x='356' y='206' width='136' height='40' rx='6' fill='#e9eff8' /><rect x='366' y='216' width='112' height='8' rx='4' fill='#d9dad7' /><rect x='366' y='230' width='84' height='8' rx='4' fill='#d9dad7' /><rect x='352' y='258' width='142' height='22' rx='6' fill='none' stroke='#d9dad7' /></g><g><rect x='36' y='298' width='468' height='26' rx='8' fill='none' stroke='#d9dad7' /><text x='270' y='315' font-size='11.5' text-anchor='middle' fill='#6b6c6f'>Dock 和底栏输入框</text></g><g><rect x='24' y='350' width='44' height='4' rx='2' fill='#3f6fb0' /><rect x='74' y='350' width='44' height='4' rx='2' fill='#d9dad7' /><rect x='124' y='350' width='44' height='4' rx='2' fill='#d9dad7' /><rect x='174' y='350' width='44' height='4' rx='2' fill='#d9dad7' /><rect x='224' y='350' width='44' height='4' rx='2' fill='#d9dad7' /><rect x='274' y='350' width='44' height='4' rx='2' fill='#d9dad7' /><text x='516' y='356' font-size='11.5' text-anchor='end' fill='#292a2c'>小周 · 运营</text></g><g><circle cx='492' cy='68' r='9' fill='none' stroke='#8d8e90' /><text x='492' y='72' font-size='11.5' text-anchor='middle' fill='#292a2c'>1</text><circle cx='262' cy='134' r='9' fill='none' stroke='#8d8e90' /><text x='262' y='138' font-size='11.5' text-anchor='middle' fill='#292a2c'>2</text><circle cx='204' cy='170' r='9' fill='none' stroke='#8d8e90' /><text x='204' y='174' font-size='11.5' text-anchor='middle' fill='#292a2c'>3</text><circle cx='312' cy='182' r='9' fill='none' stroke='#8d8e90' /><text x='312' y='186' font-size='11.5' text-anchor='middle' fill='#292a2c'>4</text><circle cx='336' cy='352' r='9' fill='none' stroke='#8d8e90' /><text x='336' y='356' font-size='11.5' text-anchor='middle' fill='#292a2c'>5</text></g><g><circle cx='549' cy='66' r='9' fill='none' stroke='#8d8e90' /><text x='549' y='70' font-size='11.5' text-anchor='middle' fill='#292a2c'>1</text><text x='566' y='70' font-weight='600' fill='#292a2c'>屏</text><text x='566' y='88' font-size='11.5' fill='#6b6c6f'>大小进页定一次，不推不拉</text><circle cx='549' cy='122' r='9' fill='none' stroke='#8d8e90' /><text x='549' y='126' font-size='11.5' text-anchor='middle' fill='#292a2c'>2</text><text x='566' y='126' font-weight='600' fill='#292a2c'>框</text><text x='566' y='144' font-size='11.5' fill='#6b6c6f'>只围要点的按钮，不压暗别处</text><circle cx='549' cy='178' r='9' fill='none' stroke='#8d8e90' /><text x='549' y='182' font-size='11.5' text-anchor='middle' fill='#292a2c'>3</text><text x='566' y='182' font-weight='600' fill='#292a2c'>字</text><text x='566' y='200' font-size='11.5' fill='#6b6c6f'>一句，12 字内，贴在框旁</text><circle cx='549' cy='234' r='9' fill='none' stroke='#8d8e90' /><text x='549' y='238' font-size='11.5' text-anchor='middle' fill='#292a2c'>4</text><text x='566' y='238' font-weight='600' fill='#292a2c'>点</text><text x='566' y='256' font-size='11.5' fill='#6b6c6f'>真按钮，松手 App 切到下一步</text><circle cx='549' cy='290' r='9' fill='none' stroke='#8d8e90' /><text x='549' y='294' font-size='11.5' text-anchor='middle' fill='#292a2c'>5</text><text x='566' y='294' font-weight='600' fill='#292a2c'>进度</text><text x='566' y='312' font-size='11.5' fill='#6b6c6f'>一段一根短条，写着现在是谁</text></g><text x='24' y='388' font-weight='600' fill='#292a2c'>每一帧这样走</text><g><rect x='24' y='400' width='160' height='52' rx='8' fill='none' stroke='#8d8e90' /><text x='104' y='422' font-weight='600' text-anchor='middle' fill='#292a2c'>开场一句</text><text x='104' y='440' font-size='11.5' text-anchor='middle' fill='#6b6c6f'>全屏，消失后进 App</text></g><g><rect x='208' y='400' width='160' height='52' rx='8' fill='none' stroke='#8d8e90' /><text x='288' y='422' font-weight='600' text-anchor='middle' fill='#292a2c'>亮框</text><text x='288' y='440' font-size='11.5' text-anchor='middle' fill='#6b6c6f'>按钮加一句话</text></g><g><rect x='392' y='400' width='160' height='52' rx='8' fill='#3f6fb0' fill-opacity='0.12' stroke='#3f6fb0' stroke-width='2' /><text x='472' y='422' font-weight='600' text-anchor='middle' fill='#292a2c'>访客点</text><text x='472' y='440' font-size='11.5' text-anchor='middle' fill='#6b6c6f'>或者往下滚</text></g><g><rect x='576' y='400' width='160' height='52' rx='8' fill='none' stroke='#8d8e90' /><text x='656' y='422' font-weight='600' text-anchor='middle' fill='#292a2c'>App 变</text><text x='656' y='440' font-size='11.5' text-anchor='middle' fill='#6b6c6f'>开标签、发消息、弹卡</text></g><g><line x1='184' y1='426' x2='208' y2='426' stroke='#8d8e90' marker-end='url(#frame-arrow)' /><line x1='368' y1='426' x2='392' y2='426' stroke='#8d8e90' marker-end='url(#frame-arrow)' /><line x1='552' y1='426' x2='576' y2='426' stroke='#8d8e90' marker-end='url(#frame-arrow)' /><path d='M656 452V472H288V452' fill='none' stroke='#8d8e90' marker-end='url(#frame-arrow)' /></g><text x='472' y='490' font-size='11.5' text-anchor='middle' fill='#6b6c6f'>下一帧</text></svg>

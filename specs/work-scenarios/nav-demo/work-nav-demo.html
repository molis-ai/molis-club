<title>Work 页标签导航</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap">
<style>
/* 布局：左栏标签和一句话，右边钉住一扇 976×660 的窗；窗口不够宽时标签排到窗上方。单一浅色，和官网一致。 */
:root {
  --paper: #fbfaf7; --ink: #1b1a18; --ink-2: #3e3c38; --mute: #69665f; --hair: rgb(27 26 24 / .12); --hair-2: rgb(27 26 24 / .2);
  --desk: #eeefef; --card: #fff; --soft: #fafaf9; --rail: #f5f5f3; --a-ink: #292a2c; --a-ink-2: #5c5d60; --a-mute: #6c6e72; --a-faint: #9a9ca0; --line: #e9e9e7; --line-2: #d5d6d4;
  --green: #42775d; --green-soft: #e9f2ec; --amber: #8a5c18; --amber-soft: #f7f0e3;
  --you: #8fb6f7; --you-ink: #0e1d36; --you-edge: rgb(14 29 54 / .45);
  --ease: cubic-bezier(.2,.7,.1,1); --spring: cubic-bezier(.2,1.35,.35,1);
  --sans: 'Jost', -apple-system, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
  --mono: ui-monospace, 'SF Mono', Menlo, monospace;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 400 14px/1.5 var(--sans); padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
h3, p { margin: 0; }
svg.i { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.track { position: relative; }
.stage { position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; height: 100dvh; display: grid; justify-content: center; align-content: center; gap: 8px; padding: 8px max(16px, env(safe-area-inset-left, 0px)) 4px max(16px, env(safe-area-inset-right, 0px)); }
.stage[data-l='wide'] { grid-template-columns: 300px auto; column-gap: 56px; }
.lead { display: flex; flex-direction: column; min-width: 0; }
.lead h2 { margin: 0 0 28px; font-weight: 300; font-size: 34px; line-height: 1.25; letter-spacing: -.01em; text-wrap: balance; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { position: relative; display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 15px; border-radius: 999px; font-size: 15px; color: var(--ink-2); background: var(--paper); box-shadow: inset 0 0 0 1px var(--hair-2); transition: color .2s var(--ease), box-shadow .2s var(--ease), transform .12s var(--ease), background-color .2s; }
.chip:hover { box-shadow: inset 0 0 0 1px rgb(27 26 24 / .42); color: var(--ink); }
.chip:active { transform: scale(.96); }
.chip .ava { width: 0; height: 22px; margin-right: -7px; opacity: 0; overflow: hidden; transform: scale(.6); transition: width .26s var(--spring), margin .26s var(--spring), opacity .18s, transform .26s var(--spring); }
.chip[aria-pressed='true'] { padding-left: 8px; color: var(--c); font-weight: 500; background: linear-gradient(90deg, color-mix(in srgb, var(--c) 18%, #fff) var(--p, 0%), color-mix(in srgb, var(--c) 8%, #fff) var(--p, 0%)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 42%, #fff); }
.chip[aria-pressed='true'] .ava { width: 22px; margin-right: 0; opacity: 1; transform: none; }
.chip .tick { display: none; margin-left: auto; color: var(--green); width: 14px; height: 14px; stroke-width: 2.4; }
.stage[data-l='wide'] .chips { display: grid; grid-template-columns: 1fr 1fr; }
.stage[data-l='mid'] .chip, .stage[data-l='mid'] .chip[aria-pressed='true'] { height: 34px; padding: 0 12px; font-size: 14px; }
.stage[data-l='mid'] .chip .ava, .stage[data-l='mid'] .chip .tick { display: none; }
.stage[data-l='mid'] .chips { gap: 6px; }
.chip[data-done] .tick { display: block; }
.say { min-height: 2.8em; margin-top: 24px; font-size: 20px; font-weight: 300; line-height: 1.4; color: var(--ink); text-wrap: balance; }
.say.swap { animation: rise .26s var(--ease); }
.tagnote { margin-top: auto; align-self: flex-start; padding: 3px 11px; border-radius: 999px; border: 1px dashed var(--hair-2); font-size: 12px; color: var(--mute); }
.stage[data-l='mid'] { justify-items: center; }
.stage[data-l='mid'] .lead { flex-direction: row; align-items: center; gap: 16px; width: 100%; height: 40px; }
.stage[data-l='mid'] .lead h2, .stage[data-l='mid'] .tagnote { display: none; }
.stage[data-l='mid'] .chips { flex-wrap: nowrap; flex: none; }
.stage[data-l='mid'] .say { margin: 0 0 0 auto; min-height: 0; font-size: 15px; font-weight: 400; color: var(--ink-2); text-align: right; }
.stage[data-l='narrow'] { align-content: start; padding-top: 16px; height: auto; position: relative; }
.stage[data-l='narrow'] .lead h2 { font-size: 26px; margin-bottom: 14px; }
.stage[data-l='narrow'] .say { margin: 12px 0 8px; font-size: 17px; min-height: 0; }
.stage[data-l='narrow'] .tagnote { margin: 0 0 8px; }

.win { position: relative; display: flex; flex-direction: column; width: 976px; height: 660px; overflow: hidden; border-radius: 18px; background: var(--desk); color: var(--a-ink); box-shadow: 0 0 0 1px rgb(27 26 24 / .13), 0 2px 4px rgb(40 30 20 / .08), 0 14px 30px -14px rgb(40 30 20 / .24), 0 40px 80px -40px rgb(40 30 20 / .4); }
.top { display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 14px; color: var(--a-faint); flex: none; }
.nav { display: flex; gap: 10px; margin-right: 8px; }
.tab { display: inline-flex; align-items: center; gap: 7px; height: 30px; max-width: 220px; padding: 0 12px; overflow: hidden; border-radius: 8px; white-space: nowrap; font-size: 13px; color: var(--a-mute); transition: background-color .2s var(--ease), color .2s, box-shadow .2s; }
.tab svg { color: var(--c); }
.tab[data-on] { background: var(--card); color: var(--c); font-weight: 500; box-shadow: 0 1px 2px rgb(40 30 20 / .1), inset 0 -2px 0 color-mix(in srgb, var(--c) 55%, #fff); }
.tab.grow { animation: grow .34s var(--ease); }
.top .end { margin-left: auto; display: flex; gap: 12px; }
.body { display: flex; flex: 1; gap: 10px; min-height: 0; padding: 0 10px; }
.card { position: relative; flex: 1; min-width: 0; overflow: hidden; border-radius: 12px; background: var(--card); box-shadow: 0 0 0 1px var(--line); }
.card.swap { animation: fade .2s var(--ease); }
.view { height: 100%; padding: 30px 34px 20px; display: flex; flex-direction: column; }
.side { width: 330px; flex: none; display: flex; flex-direction: column; overflow: hidden; border-radius: 12px; background: var(--card); box-shadow: 0 0 0 1px var(--line); }
.side[hidden] { display: none; }
.side.open { animation: slide .28s var(--ease); }
.side-h { flex: none; padding: 14px 18px 10px; border-bottom: 1px solid var(--line); }
.side-h b { font-size: 15px; font-weight: 500; }
.side-h span { margin-left: 8px; padding: 1px 9px; border-radius: 999px; background: var(--a-ink); color: #fff; font-size: 11.5px; }
.side-h span.lite { background: var(--rail); color: var(--a-mute); }
.feed { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; gap: 12px; padding: 14px 16px 12px; }
.compose { flex: none; margin: 0 12px 12px; padding: 9px 12px; border-radius: 12px; box-shadow: inset 0 0 0 1px var(--line); color: var(--a-faint); font-size: 12px; }
.bar { flex: none; display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 14px 0 10px; color: var(--a-mute); }
.dock { display: flex; align-items: center; gap: 2px; height: 38px; padding: 0 4px; border-radius: 10px; background: var(--rail); box-shadow: inset 0 0 0 1px var(--line); }
.dock .now { display: inline-flex; align-items: center; gap: 6px; width: 112px; padding: 0 8px; font-size: 12.5px; white-space: nowrap; color: var(--a-ink-2); }
.dock .now svg { color: var(--c); }
.ic { position: relative; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; color: var(--a-mute); transition: background-color .2s, color .2s; }
.dock .ic[data-on] { background: var(--card); color: var(--a-ink); box-shadow: 0 1px 2px rgb(40 30 20 / .12); }
.badge { position: absolute; top: 1px; right: 0; min-width: 14px; height: 14px; padding: 0 3px; border-radius: 7px; background: #ea9260; color: #fff; font-size: 10px; font-weight: 600; line-height: 14px; text-align: center; }
.badge.bump { animation: bump .36s var(--spring); }
.input { flex: 1; display: flex; align-items: center; justify-content: space-between; height: 36px; padding: 0 12px; border-radius: 10px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); font-size: 13px; color: var(--a-faint); }
.waitchip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 8px; background: var(--amber-soft); color: var(--amber); font-size: 12.5px; font-weight: 500; }
.waitchip[hidden] { display: none; }
.me { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--c); color: #fff; font-size: 12px; font-weight: 600; transition: background-color .24s; }
.me.swap { animation: bump .36s var(--spring); }

.ava { flex: none; display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--c); color: #fff; font-size: 11px; font-weight: 600; font-style: normal; }
.ava.sm { width: 16px; height: 16px; font-size: 9px; }
.msg { display: flex; gap: 9px; font-size: 14px; line-height: 1.5; }
.msg > div { min-width: 0; flex: 1; }
.msg b.n { display: block; font-size: 12px; font-weight: 500; color: var(--a-mute); }
.msg.ai .t { padding: 8px 11px; border-radius: 4px 12px 12px 12px; background: var(--green-soft); color: #2e4d3e; }
.ev { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 5px; font-size: 12px; color: var(--a-mute); }
.ev b { font-weight: 500; color: var(--a-ink-2); }
.attach { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; padding: 4px 9px; border-radius: 7px; background: #fff; box-shadow: inset 0 0 0 1px var(--line); font-size: 12px; color: var(--a-ink-2); }
.ck { margin: 0; padding: 0; list-style: none; }
.ck li { display: flex; gap: 6px; }
.ck li::before { content: '✓'; color: var(--green); font-weight: 600; }
.ck b { font-weight: 600; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }

.btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 13px; border-radius: 9px; background: var(--a-ink); color: #fff; font-size: 13px; font-weight: 500; white-space: nowrap; transition: box-shadow .16s var(--ease), transform .12s var(--ease), background-color .16s; }
.btn:hover { background: #000; }
.btn:active { transform: scale(.96); }
.btn.ghost { background: var(--rail); color: var(--a-ink-2); box-shadow: inset 0 0 0 1px var(--line); }
.ring { position: relative; z-index: 3; box-shadow: 0 0 0 1.5px rgb(41 42 44 / .72), 0 0 0 6px rgb(143 182 247 / .42) !important; animation: ringin .32s var(--spring); }
.ring:hover { box-shadow: 0 0 0 1.5px var(--a-ink), 0 0 0 7px rgb(143 182 247 / .62) !important; }
.nudge { animation: nudge .34s var(--ease) !important; }
:focus-visible { outline: 2px solid #3f6fb0; outline-offset: 3px; }
.later { opacity: 0; transform: translateY(6px); pointer-events: none; }
.at { transition: opacity .24s var(--ease), transform .3s var(--ease); }

.crumb { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--a-mute); }
.crumb svg { color: var(--c); }
.pill { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 9px; border-radius: 999px; background: var(--rail); font-size: 12px; color: var(--a-ink-2); transition: background-color .2s, color .2s; }
.pill.warn, .pill[data-s='you'] { background: var(--amber-soft); color: var(--amber); font-weight: 500; }
.pill.ok, .pill[data-s='done'] { background: var(--green-soft); color: var(--green); font-weight: 500; }
.pill[data-s='run']::before { content: ''; width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid currentColor; border-right-color: transparent; animation: spin .9s linear infinite; }
.view h3 { margin-top: 8px; font-size: 22px; font-weight: 400; letter-spacing: -.005em; }
.sub { margin-top: 2px; font-size: 13px; color: var(--a-mute); }
.head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.lst { margin-top: 18px; display: flex; flex-direction: column; gap: 2px; }
.row { display: flex; align-items: center; gap: 10px; min-height: 40px; width: 100%; padding: 7px 10px; border-radius: 9px; font-size: 14px; transition: background-color .16s, box-shadow .16s, transform .12s; }
.row .tt { flex: 1; min-width: 0; }
.row em { font-style: normal; font-size: 12px; color: var(--a-mute); white-space: nowrap; }
.row.hot { background: var(--amber-soft); }
.row.hot em { color: var(--amber); font-weight: 500; }
button.row:hover { background: #f3e9d6; }
button.row:active { transform: scale(.985); }
.row.fixed { background: var(--green-soft); }
.row.fixed em { color: var(--green); font-weight: 500; }
.lst .gap { height: 10px; }
.avg { flex: none; display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: #ece9e3; color: #5b4a33; font-size: 11px; font-weight: 600; }
.rg { flex: none; width: 16px; height: 16px; }
.lbl { margin-top: 18px; font-size: 12px; color: var(--a-mute); }
.diff { margin-top: 12px; padding: 12px 14px; border-radius: 10px; background: #f7f7f5; font: 12.5px/1.75 var(--mono); color: var(--a-ink-2); overflow: hidden; white-space: pre; }
.diff .d { color: #a0442e; }
.diff .a { color: #2f7a55; }
.reqrow { display: flex; align-items: center; gap: 10px; margin-top: 6px; padding: 8px 10px 8px 12px; border-radius: 10px; box-shadow: inset 0 0 0 1px var(--line); font-size: 14px; }
.reqrow .tt { flex: 1; }

.cu { margin-top: 2px; padding: 10px; border-radius: 12px; background: #fff; box-shadow: inset 0 0 0 1px var(--line); }
.cu-h { display: flex; align-items: center; justify-content: space-between; font-weight: 500; font-size: 13px; }
.cu p { margin: 3px 0 8px; font-size: 12.5px; color: var(--a-ink-2); }
.screen { position: relative; height: 124px; overflow: hidden; border-radius: 8px; background: linear-gradient(180deg, #aebdcb 0%, #d6cdc4 62%, #d9b896 100%); }
.scr { position: absolute; left: 50%; top: 14px; width: 66%; height: 96px; margin-left: -33%; padding: 9px 10px; border-radius: 6px; background: #fff; box-shadow: 0 6px 16px rgb(40 30 20 / .22); font-size: 10.5px; color: var(--a-ink-2); }
.scr .ln { height: 6px; margin: 5px 0; border-radius: 3px; background: #ecebe8; }
.scr .ln.s { width: 58%; }
.scr .cta { display: inline-block; margin-top: 4px; padding: 2px 8px; border-radius: 5px; background: var(--a-ink); color: #fff; font-size: 9.5px; }
.scr .okk { position: absolute; right: 8px; bottom: 8px; color: var(--green); font-weight: 600; }
.ptr { position: absolute; left: 22%; top: 76%; width: 11px; height: 11px; animation: ptr 1.5s var(--ease) both; }
.ptr path { fill: var(--a-ink); stroke: #fff; stroke-width: 1.5; }

.cv { flex: 1; min-height: 0; position: relative; margin-top: 16px; border-radius: 12px; background-color: #f5f5f3; background-image: radial-gradient(#d9d9d6 1px, transparent 1px); background-size: 14px 14px; padding: 18px 196px 18px 18px; }
.cv-app { height: 100%; padding: 18px; border-radius: 12px; background: #fff; box-shadow: 0 1px 2px rgb(40 30 20 / .08), 0 12px 24px -14px rgb(40 30 20 / .22); }
.cv-field { margin-top: 12px; padding: 7px 10px; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--line); font-size: 12.5px; color: var(--a-faint); }
.cv-out { margin-top: 12px; padding: 12px; border-radius: 8px; background: #eef3fb; box-shadow: inset 0 0 0 1px #c5d6f1; color: #3f6fb0; font-size: 12.5px; }
.node { position: absolute; right: 18px; width: 158px; display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 8px 10px; border-radius: 9px; background: #fff; box-shadow: inset 0 0 0 1.5px #3b8a68; font-size: 12.5px; }
.node svg { color: #3b8a68; }
.mets { margin-top: 14px; display: flex; gap: 22px; }
.met b { display: block; font-size: 24px; font-weight: 400; font-variant-numeric: tabular-nums; }
.met span { font-size: 12px; color: var(--a-mute); }
.chart { flex: 1; min-height: 0; margin-top: 12px; display: flex; align-items: flex-end; gap: 10px; }
.col { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; font-size: 11.5px; color: var(--a-mute); font-variant-numeric: tabular-nums; }
.col i { width: 100%; max-width: 40px; border-radius: 4px 4px 0 0; background: #cfe0dc; }
.col.top i { background: #2c7d74; }
.col.top { color: var(--a-ink); }
.doc-p { margin-top: 12px; font-size: 14.5px; line-height: 1.75; color: var(--a-ink); }
.caret { display: inline-block; width: 1.5px; height: 1.05em; vertical-align: -2px; background: var(--a-ink); animation: blink 1.1s steps(2) infinite; }
.name { display: inline-block; margin: 0 2px; padding: 0 5px; border-radius: 3px 8px 8px 8px; color: #fff; font-size: 10.5px; vertical-align: 3px; }
.offer { margin-top: 14px; padding: 12px 14px; border-radius: 12px; background: #fff; box-shadow: 0 0 0 1px var(--line), 0 12px 26px -12px rgb(40 30 20 / .28); }
.offer b { font-weight: 500; }
.tbl { width: 100%; margin-top: 12px; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.tbl th { padding: 6px 10px; text-align: left; font-weight: 400; font-size: 12px; color: var(--a-mute); border-bottom: 1px solid var(--line); }
.tbl td { padding: 8px 10px; border-bottom: 1px solid var(--line); }
.tbl tr.sel td { background: rgb(143 182 247 / .22); }
.tb { width: fit-content; margin-top: 12px; align-self: flex-start; display: flex; align-items: center; gap: 6px; padding: 6px; border-radius: 12px; background: #fff; box-shadow: 0 0 0 1px var(--line), 0 12px 26px -12px rgb(40 30 20 / .28); }
.slide { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; margin-top: 14px; padding: 24px 40px; border-radius: 10px; background: #2d2a28; color: #f4efe8; }
.slide h4 { margin: 0 0 12px; font-size: 22px; font-weight: 400; }
.slide li { margin: 5px 0; font-size: 13.5px; color: #d9d2c8; }
.slide ul { margin: 0; padding-left: 18px; }
.thumbs { flex: none; display: flex; gap: 8px; margin-top: 10px; }
.thumbs i { flex: 1; height: 44px; border-radius: 5px; background: #eeece8; }
.thumbs i:first-child { background: #2d2a28; box-shadow: 0 0 0 2px #fff, 0 0 0 3.5px #b5533c; }
.todo { display: flex; align-items: center; gap: 7px; padding: 5px 0; font-size: 12.5px; border-top: 1px solid rgb(66 119 93 / .18); }
.todo:first-of-type { margin-top: 6px; }
.article { margin-top: 14px; font-size: 14.5px; line-height: 1.8; color: var(--a-ink-2); max-width: 540px; }
.mark { background: rgb(143 182 247 / .3); border-radius: 2px; color: var(--a-ink); }
.shelf-it { padding: 10px 12px; border-radius: 10px; background: var(--soft); box-shadow: inset 0 0 0 1px var(--line); font-size: 13px; line-height: 1.55; }
.quote { margin-top: 10px; padding: 8px 12px; border-left: 2px solid var(--line-2); font-size: 13.5px; line-height: 1.65; color: var(--a-ink-2); }
.ghost-fly { position: fixed; z-index: 30; pointer-events: none; padding: 8px 12px; border-radius: 10px; background: #fff; box-shadow: 0 0 0 1px var(--line), 0 18px 34px -14px rgb(40 30 20 / .4); font-size: 12.5px; color: var(--a-ink); white-space: nowrap; overflow: hidden; }

.tag { position: fixed; left: 0; top: 0; z-index: 40; pointer-events: none; padding: 5px 9px 6px 8px; border-radius: 1px 10px 10px 10px; background: var(--you); box-shadow: 0 0 0 1px var(--you-edge), 0 4px 10px -3px rgb(0 0 0 / .3); font-size: 12.5px; font-weight: 600; line-height: 1; letter-spacing: .04em; color: var(--you-ink); white-space: nowrap; }
.tag b { display: inline-block; font-weight: 600; }
.tag b.swap { animation: bump .36s var(--spring); }

.homegrid { display: grid; grid-template-columns: minmax(0, 1fr) 170px; gap: 22px; }
.cal .ev2 { display: flex; gap: 8px; padding: 6px 0; font-size: 13px; color: var(--a-ink-2); border-top: 1px solid var(--line); }
.cal .ev2 b { font-weight: 500; font-variant-numeric: tabular-nums; color: var(--a-ink); }
.toast { position: absolute; top: 14px; right: 14px; z-index: 4; display: flex; align-items: center; gap: 8px; max-width: 280px; padding: 9px 12px; border-radius: 12px; background: #fff; box-shadow: 0 0 0 1px var(--line), 0 14px 28px -12px rgb(40 30 20 / .32); font-size: 12.5px; color: var(--a-ink-2); }
.toast b { font-weight: 500; color: var(--a-ink); }
.toast svg { color: #ea9260; }

.sheet { position: absolute; left: 50%; top: 50%; z-index: 4; width: 340px; margin: -128px 0 0 -170px; padding: 18px 20px; border-radius: 14px; background: #fff; box-shadow: 0 0 0 1px var(--line), 0 8px 16px -8px rgb(40 30 20 / .2), 0 30px 60px -20px rgb(40 30 20 / .42); }
.sheet > b { font-size: 16px; font-weight: 500; }

.sheet .sub + .perm { margin-top: 10px; }
.perm span { flex: 1; }
.perm em { font-style: normal; font-size: 12px; color: var(--a-mute); }
.chain { margin-top: 18px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.stp { position: relative; display: flex; flex-direction: column; gap: 3px; padding: 11px 12px; border-radius: 11px; box-shadow: inset 0 0 0 1px var(--line); background: var(--soft); }
.stp + .stp::before { content: ''; position: absolute; left: -12px; top: 50%; width: 12px; height: 1.5px; background: var(--line-2); }
.stp span { color: var(--a-mute); }
.stp b { font-size: 13.5px; font-weight: 500; }
.stp em { font-style: normal; font-size: 12px; color: var(--a-mute); }
.stp[data-s='done'] { background: var(--green-soft); box-shadow: inset 0 0 0 1px #c8dccf; }
.stp[data-s='done'] em, .stp[data-s='done'] span { color: var(--green); }
.stp[data-s='wait'] { background: var(--amber-soft); box-shadow: inset 0 0 0 1px #e8d8b8; }
.stp[data-s='wait'] em, .stp[data-s='wait'] span { color: var(--amber); }
.dock .ic.new { color: var(--c); animation: bump .4s var(--spring); }
.auto { position: fixed; left: 0; top: 0; z-index: 41; pointer-events: none; display: flex; align-items: flex-start; gap: 1px; transition: transform .65s var(--ease); }
.auto svg { width: 15px; height: 18px; transition: transform .12s var(--ease); }
.auto path { fill: var(--a-ink); stroke: #fff; stroke-width: 1.3; }
.auto b { margin-top: 14px; padding: 5px 9px 6px 8px; border-radius: 1px 10px 10px 10px; background: var(--you); box-shadow: 0 0 0 1px var(--you-edge), 0 4px 10px -3px rgb(0 0 0 / .3); font-size: 12.5px; font-weight: 600; line-height: 1; letter-spacing: .04em; color: var(--you-ink); white-space: nowrap; }
.auto.press svg { transform: scale(.82); }
.pressing { transform: scale(.96) !important; }

@keyframes rise { from { opacity: 0; transform: translateY(5px); } }
@keyframes fade { from { opacity: 0; } }
@keyframes slide { from { opacity: 0; transform: translateX(14px); } }
@keyframes grow { from { max-width: 0; padding-left: 0; padding-right: 0; opacity: 0; } }

@keyframes nudge { 25% { transform: translateX(-3px); } 60% { transform: translateX(3px); } 100% { transform: none; } }

}

<script>
const ic = (n, s = '') => `<svg class="i" style="${s}" aria-hidden="true"><use href="#${n}"/></svg>`;
const ROLE = {

  lead: ['负', '负责人', '#5a5fa8'], hr: ['人', '人事', '#9a6b2f'], sales: ['销', '销售', '#a8476a'], legal: ['法', '法务', '#6b7a3a'],
};
const ava = (w, sm) => `<i class="ava${sm ? ' sm' : ''}" style="--c:${ROLE[w][2]}">${ROLE[w][0]}</i>`;
const at = (ms) => (ms == null ? '' : ` data-at="${ms}"`);
const msg = (w, html, ms) => `<div class="msg${w === 'ai' ? ' ai' : ''}"${at(ms)}>${ava(w)}<div><b class="n">${ROLE[w][1]}</b><div class="t">${html}</div></div></div>`;
const ev = (html, ms) => `<p class="ev"${at(ms)}>${html}</p>`;
const hand = (a, b, ms) => ev(`${ava(a, 1)}<b>${ROLE[a][1]}</b> 转给 ${ava(b, 1)}<b>${ROLE[b][1]}</b>`, ms);
const go = (t, ms, cls = '') => `<button class="btn ${cls}" data-go${at(ms)}>${t}</button>`;
const ringSvg = (s) => s === 'done'
  ? `<svg class="rg" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.2" fill="#42775d" stroke="#42775d" stroke-width="1.6"/><path d="M5.2 8.2l1.9 1.9 3.8-4" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>`
  : s === 'wait'
    ? `<svg class="rg" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.2" fill="#f7f0e3" stroke="#8a5c18" stroke-width="1.6"/></svg>`
    : `<svg class="rg" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.2" stroke="#d5d6d4" stroke-width="1.6"/><path d="M8 1.8a6.2 6.2 0 0 1 6.2 6.2" stroke="#5c5d60" stroke-width="1.6" stroke-linecap="round"/></svg>`;

const TABS = {
  home: { n: '首页', i: 'home', c: '#5a5fa8', d: 'home', p: '首页' },
  fb: { n: '用户反馈', i: 'inbox', c: '#8a5c18', d: 'inbox', p: 'Inbox' },
  code: { n: '修付款转圈', i: 'code', c: '#3d3f43', d: 'code', p: 'Coding' },
  review: { n: '4 月经营复盘', i: 'file', c: '#a4552f', d: 'file', p: 'Pages' },

  draft: { n: '离线也能用了', i: 'file', c: '#a4552f', d: 'file', p: 'Pages' },

};

const OK = (t, ms) => ev(`${ic('check', 'width:13px;height:13px;color:#42775d')}${t}`, ms);

/* 看今天 */
const home = (st, target) => `<div class="view"><p class="crumb" style="--c:#5a5fa8">${ic('home')}首页 <span class="pill">主线：新版发布</span></p>

  { s: 4, w: 'ops', t: ['feed', 'draft'], on: 'draft', m: () => draft(true, true), badge: 0, side: () => talk(
      msg('ai', `已贴好${wxScreen('done')}`) + OK('<b>已发送</b>', 120)) },

  { s: 5, w: 'hr', t: ['hire'], on: 'hire', m: () => hire(), badge: 0, side: () => talk(
      msg('hr', '面试报名每次都手工收，太烦了', 100) + msg('ai', `我搭个小工具：填完进表格，自动约时间<div class="acts">${go('开始搭', 1000)}</div>`, 600)) },
  { s: 5, w: 'hr', t: ['hire', 'studio'], on: 'studio', m: () => studio(), badge: 0 },
  { s: 5, w: 'hr', say: '要紧的事你说了算', t: ['hire', 'studio'], on: 'studio', m: () => studio(true) + permit(), badge: 0 },
  { s: 5, w: 'hr', t: ['hire', 'tool'], on: 'tool', m: () => tool(), badge: 0, extra: 1, side: () => talk(
      ev(`${ic('form', 'width:13px;height:13px;color:#9a6b2f')}<b>报名工具</b> 已装好`, 60) + msg('hr', '这周报名怎么样了？', 300) + msg('ai', '12 份，3 位约好了时间', 800)) },

  { s: 6, w: 'sales', t: ['weekly'], on: 'weekly', m: () => weekly(), badge: 0, side: () => talk(
      msg('sales', '这份周报每周一都要发给老板', 100) + msg('ai', `我排成一条链，每周一 9 点自己跑<div class="acts">${go('看看怎么跑', 1000)}</div>`, 600)) },
  { s: 6, w: 'sales', t: ['weekly', 'flow'], on: 'flow', m: () => flowV(0), badge: 0 },
  { s: 6, w: 'sales', t: ['weekly', 'flow'], on: 'flow', m: () => flowV(1) + `<div class="toast"${at(300)}>${ic('bell')}<span><b>周一 9:02</b> 周报写好了</span></div>`, badge: 0, wait: 1, side: () => aside(
      msg('ai', `周报写好了，发给老板吗？<br><span class="attach">${ic('file', 'width:12px;height:12px;color:#a4552f')}销售周报 · 第 19 周</span><div class="acts">${go('发送', 800)}</div>`, 450)) },
  { s: 6, w: 'sales', t: ['weekly', 'flow'], on: 'flow', m: () => flowV(2), badge: 0, side: () => aside(
      OK('<b>已发给老板</b>', 100) + msg('ai', '下周一 9 点再跑', 300)) },

  { s: 7, w: 'legal', t: ['quote'], on: 'quote', m: () => quote(0), badge: 0, side: () => talk(
      msg('legal', '金额要写含税价，以后都这样', 100) + msg('ai', `改好了，要记下来吗？<div class="acts">${go('记一下', 900)}</div>`, 600)) },
  { s: 7, w: 'legal', say: '规矩写一次，几家 AI 都读得到', t: ['quote', 'memo'], on: 'memo', m: () => memo(), badge: 0, side: () => aside(
      msg('ai', `记好了。接下来谁写？${aiPick}`, 450)) },
  { s: 7, w: 'legal', t: ['quote', 'memo'], on: 'quote', m: () => quote(1), badge: 0, side: () => talk(
      ev(`${ic('brain', 'width:13px;height:13px;color:#6b7a3a')}<b>Codex</b> 读到 3 条做法`, 60) + msg('ai', `新加的一项也写了含税价<div class="acts">${go('通过', 1000)}</div>`, 700)) },
  { s: 7, w: 'legal', t: ['quote', 'memo'], on: 'quote', m: () => quote(2), badge: 0, side: () => talk(
      ev(`${ic('brain', 'width:13px;height:13px;color:#6b7a3a')}<b>Codex</b> 读到 3 条做法`) + OK('<b>报价单</b> 已通过', 120)) },
];
const END = FRAMES.map((f, i) => (FRAMES[i + 1]?.s !== f.s ? i : -1)).filter((i) => i >= 0);
const FIRST = SEGS.map((_, s) => FRAMES.findIndex((f) => f.s === s));

const $ = (id) => document.getElementById(id);
const track = $('track'), stage = $('stage'), win = $('win'), main = $('main'), side = $('side'), top_ = $('top'), bar = $('bar'), chips = $('chips'), sayEl = $('say'), tag = $('tag'), tagb = $('tagb');
const reduce = matchMedia('(prefers-reduced-motion: reduce)');

chips.innerHTML = SEGS.map((s, i) => `<button class="chip" data-seg="${i}" aria-pressed="false" style="--c:${ROLE[s.w][2]}">${ava(s.w)}<span>${s.n}</span><svg class="i tick" aria-hidden="true"><use href="#check"/></svg></button>`).join('');
const chipEls = [...chips.children];

let cur = -1, pending = false, timers = [], lastKeyboard = false;
const IDLE = 5000, HOLD = 1500, END_HOLD = 2400, MOVE = 650, PRESS = 160;
let lastInput = performance.now(), playing = false, autoTimer = 0, expectY = null;
const auto = $('auto'), autob = $('autob');
const done = new Set();
let step = 500;

function clearTimers() { timers.forEach(clearTimeout); timers = []; }
function applySwap(el) { const [, s, text] = el.dataset.swap.split(':'); if (s !== 'warn') el.dataset.s = s; el.textContent = text; delete el.dataset.swap; }

function flush() {
  clearTimers();
  win.querySelectorAll('.later').forEach((el) => el.classList.remove('later'));
  win.querySelectorAll('[data-swap]').forEach(applySwap);
  ready();
}

function ready() {
  pending = false;
  const t = target();
  if (t) { t.classList.add('ring'); if (lastKeyboard) t.focus({ preventScroll: true }); }
  if (playing) armAuto(END.includes(cur) ? END_HOLD : HOLD);
  else armAuto(Math.max(0, IDLE - (performance.now() - lastInput)));
}

function armAuto(ms) { clearTimeout(autoTimer); autoTimer = setTimeout(autoStep, ms); }

function canAuto() {
  if (reduce.matches || document.visibilityState !== 'visible') return false;
  const r = stage.getBoundingClientRect();
  if (stage.dataset.l === 'narrow') return r.top < innerHeight * 0.5 && r.bottom > innerHeight * 0.5;
  return r.top > -2 && r.top < 60;
}

function showGhost(t) {
  const r = t.getBoundingClientRect();
  if (auto.hidden) {
    const w = win.getBoundingClientRect();
    auto.style.transition = 'none';
    auto.style.transform = `translate(${w.right - 70}px, ${w.bottom - 40}px)`;
    auto.hidden = false;
    void auto.offsetWidth;
    auto.style.transition = '';
  }
  autob.textContent = ROLE[FRAMES[cur].w][1];
  auto.style.transform = `translate(${r.right - Math.min(r.width * 0.22, 22)}px, ${r.bottom - Math.min(r.height * 0.3, 10)}px)`;
}

function autoStep() {
  if (pending) return;
  const t = target();
  if (!t || !canAuto()) { stopAuto(); return; }
  playing = true;
  tag.hidden = true;
  showGhost(t);
  autoTimer = setTimeout(() => {
    t.classList.add('pressing');
    auto.classList.add('press');
    autoTimer = setTimeout(() => {
      t.classList.remove('pressing');
      auto.classList.remove('press');
      press(t);
    }, PRESS);
  }, MOVE);
}

function stopAuto() {
  clearTimeout(autoTimer);
  playing = false;
  auto.hidden = true;
  auto.classList.remove('press');
  document.querySelectorAll('.pressing').forEach((el) => el.classList.remove('pressing'));
}

function noteInput() {
  lastInput = performance.now();
  stopAuto();
  if (!pending) armAuto(IDLE);
}

function target() {
  const inWin = win.querySelector('[data-go]');
  if (inWin) return inWin;
  const f = FRAMES[cur];
  return END.includes(cur) && f.s + 1 < SEGS.length ? chipEls[f.s + 1] : null;
}

function reveal(instant) {
  clearTimers();
  chipEls.forEach((c) => c.classList.remove('ring'));
  const items = [...win.querySelectorAll('[data-at]')];
  const swaps = [...win.querySelectorAll('[data-swap]')];
  if (instant || reduce.matches) { swaps.forEach(applySwap); ready(); return; }
  pending = true;
  let last = 0;
  items.forEach((el) => {
    const ms = +el.dataset.at;
    last = Math.max(last, ms);
    el.classList.add('at', 'later');
    timers.push(setTimeout(() => el.classList.remove('later'), Math.max(30, ms)));
  });
  swaps.forEach((el) => {
    const ms = +el.dataset.swap.split(':')[0];
    last = Math.max(last, ms);
    timers.push(setTimeout(() => applySwap(el), ms));
  });
  timers.push(setTimeout(ready, last + 150));
}

function renderBar(f, prev) {
  const tab = TABS[f.on];
  const dock = [['home'], ['inbox', f.badge], ['file'], ['code'], ['table'], ['blocks']];
  if (f.extra) dock.push(['form', 0, 1]);
  const bumped = prev && prev.badge !== f.badge;
  bar.innerHTML = `<div class="dock"><span class="now" style="--c:${tab.c}">${ic(tab.i)}${tab.p}</span>${dock.map(([k, b, isNew]) => `<span class="ic${isNew ? ' new' : ''}" style="${isNew ? '--c:#9a6b2f' : ''}"${tab.d === k ? ' data-on' : ''}>${ic(k)}${b ? `<span class="badge${bumped ? ' bump' : ''}">${b}</span>` : ''}</span>`).join('')}</div>
    <span class="input">问助理，或按 ⌘K 搜索${ic('send')}</span>
    <span class="waitchip"${f.wait ? '' : ' hidden'}>${ringSvg('wait')}等你 ${f.wait || 0}</span>
    <span class="ic" style="color:${f.side ? 'var(--a-ink)' : 'var(--a-faint)'}">${ic('talk')}</span>
    <span class="me${prev && prev.w !== f.w ? ' swap' : ''}" style="--c:${ROLE[f.w][2]}">${ROLE[f.w][0]}</span>`;
}

function press(t) {
  if (t.classList.contains('chip')) { moveTo(FIRST[+t.dataset.seg], 'chip'); return; }
  const r = t.getBoundingClientRect();
  const nextF = FRAMES[cur + 1];
  moveTo(cur + 1, 'click');
  if (nextF?.fly) fly(r, nextF.fly);
}

function render(i, how) {
  clearTimeout(autoTimer);
  const f = FRAMES[i], prev = FRAMES[cur];
  const moving = how === 'click' || how === 'chip';
  const prevTabs = prev ? prev.t : [];
  top_.innerHTML = `<span class="nav">${ic('left')}${ic('right')}</span>` + f.t.map((id) => {
    const t = TABS[id];
    return `<span class="tab${moving && !prevTabs.includes(id) ? ' grow' : ''}" style="--c:${t.c}"${f.on === id ? ' data-on' : ''}>${ic(t.i)}${t.n}</span>`;
  }).join('') + `<span class="end">${ic('plus')}${ic('grid')}</span>`;

  main.innerHTML = f.m();
  main.classList.remove('swap');
  if (moving && (!prev || prev.on !== f.on || prev.s !== f.s)) { void main.offsetWidth; main.classList.add('swap'); }

  if (f.side) {
    const data = f.side();
    side.innerHTML = `<div class="side-h">${data.h}</div><div class="feed" style="${data.top ? 'justify-content:flex-start' : ''}">${data.body}</div><div class="compose">${data.compose || '让助理做点什么'}</div>`;
    const opening = side.hidden;
    side.hidden = false;
    side.classList.remove('open');
    if (moving && opening) { void side.offsetWidth; side.classList.add('open'); }
  } else { side.hidden = true; side.innerHTML = ''; }

  renderBar(f, prev);

  const text = f.say || SEGS[f.s].say;
  if (sayEl.textContent !== text) { sayEl.textContent = text; sayEl.classList.remove('swap'); void sayEl.offsetWidth; sayEl.classList.add('swap'); }

  if (END.includes(i)) done.add(f.s);
  chipEls.forEach((c, n) => {
    c.setAttribute('aria-pressed', String(n === f.s));
    if (done.has(n)) c.dataset.done = ''; else delete c.dataset.done;
    const span = FRAMES.filter((x) => x.s === n).length - 1;
    const pos = i - FIRST[n];
    c.style.setProperty('--p', n === f.s ? `${Math.round((pos / span) * 100)}%` : '0%');
  });

  if (!prev || prev.w !== f.w) { tagb.textContent = ROLE[f.w][1]; tagb.classList.remove('swap'); void tagb.offsetWidth; tagb.classList.add('swap'); }
  cur = i;
  reveal(!moving);
}

function fly(rect, label) {
  const land = win.querySelector('[data-land]');
  if (!land || reduce.matches) return;
  const to = land.getBoundingClientRect();
  const g = document.createElement('div');
  g.className = 'ghost-fly';
  g.textContent = label;
  g.style.left = `${rect.left}px`;
  g.style.top = `${rect.top}px`;
  document.body.append(g);
  land.style.opacity = 0;
  const tx = to.left - rect.left, ty = to.top - rect.top;
  const a = g.animate([{ transform: 'none', opacity: 1 }, { transform: `translate(${tx}px, ${ty}px)`, opacity: 1, width: `${Math.min(to.width, 340)}px` }], { duration: 420, easing: 'cubic-bezier(.2,.7,.1,1)' });
  a.onfinish = () => { g.remove(); land.style.opacity = ''; };
}

function moveTo(i, how) {
  if (i < 0 || i >= FRAMES.length || i === cur) return;
  render(i, how);
  if (stage.dataset.l !== 'narrow') { expectY = Math.round(trackTop() + i * step); window.scrollTo(0, expectY); }
}

function nudge() {
  const t = target();
  if (!t) return;
  t.classList.remove('nudge');
  void t.offsetWidth;
  t.classList.add('nudge');
  t.addEventListener('animationend', () => t.classList.remove('nudge'), { once: true });
}

win.addEventListener('click', (e) => {
  if (pending) { flush(); return; }
  const t = e.target.closest('[data-go]');
  if (t) press(t); else nudge();
});
chips.addEventListener('click', (e) => {
  const c = e.target.closest('.chip');
  if (c) moveTo(FIRST[+c.dataset.seg], 'chip');
});
addEventListener('keydown', () => { lastKeyboard = true; noteInput(); });
addEventListener('pointerdown', () => { lastKeyboard = false; noteInput(); }, true);
addEventListener('wheel', noteInput, { passive: true });
addEventListener('touchstart', noteInput, { passive: true });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') noteInput(); else stopAuto(); });

win.addEventListener('pointermove', (e) => {
  if (e.pointerType === 'touch' || playing) return;
  tag.hidden = false;
  tag.style.transform = `translate(${e.clientX + 12}px, ${e.clientY + 15}px)`;
});
win.addEventListener('pointerleave', () => { tag.hidden = true; });

function trackTop() { return track.getBoundingClientRect().top + scrollY; }

function fit() {
  const vw = innerWidth, vh = innerHeight;
  const l = vw >= 1412 ? 'wide' : vw >= 1024 ? 'mid' : 'narrow';
  stage.dataset.l = l;
  let s;
  if (l === 'wide') { s = Math.min(1.2, (vw - 436) / 976, (vh - 48) / 660); if (s >= 1 && s < 1.05) s = 1; }
  else if (l === 'mid') { s = Math.min(1, (vw - 48) / 976, (vh - 60) / 660); }
  else { s = Math.min(1, (vw - 32) / 976); }
  win.style.zoom = s;
  step = Math.max(260, vh * 0.42);
  track.style.height = l === 'narrow' ? 'auto' : `${Math.round((FRAMES.length - 1) * step + vh)}px`;
}

let ticking = false;
addEventListener('scroll', () => {
  if (expectY === null || Math.abs(scrollY - expectY) > 3) noteInput();
  if (ticking || stage.dataset.l === 'narrow') return;
  ticking = true;
  requestAnimationFrame(() => {
    ticking = false;
    const i = Math.max(0, Math.min(FRAMES.length - 1, Math.round((scrollY - trackTop()) / step)));
    if (i !== cur) render(i, i < cur ? 'back' : 'scroll');
  });
}, { passive: true });
addEventListener('resize', () => { fit(); if (cur >= 0 && stage.dataset.l !== 'narrow') { expectY = Math.round(trackTop() + cur * step); window.scrollTo(0, expectY); } });

fit();
render(0, 'load');
</script>

name: Development checks

# Validation only. Cloudflare non-production branch builds are disabled.
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Club build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - name: Read immutable Auth source
        id: auth
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync, appendFileSync} from 'node:fs';
          const metadata = JSON.parse(readFileSync('lib/account/contracts/snapshot.json'));
          const revision = metadata.sourceRevision;
          if (!/^[a-f0-9]{40}$/.test(revision)) throw Error('Auth revision must be an immutable SHA');
          appendFileSync(process.env.GITHUB_OUTPUT, `revision=${revision}\n`);
          NODE
      - uses: actions/checkout@v6
        with:
          repository: molis-ai/auth
          ref: ${{ steps.auth.outputs.revision }}
          path: .claude/auth-ci
          persist-credentials: false
      - name: Verify contract source, version, hashes and generated types
        run: node .claude/auth-ci/contracts/unified-account/verify-product.mjs club "$GITHUB_WORKSPACE"
      - name: Install locked dependencies
        run: npm ci
      - name: Check types, lint and run isolated tests
        run: npm run check && npm run lint && npm test
      - name: Build with synthetic bindings and mock account providers
        env:
          CLOUDFLARE_D1_DATABASE_ID: '00000000-0000-4000-8000-000000000000'
          CLOUDFLARE_D1_DATABASE_NAME: 'club-ci-synthetic'
          MOLIS_CLUB_ACCOUNT_CONFIG: >-
            {"applicationId":"molis-club-unified-local-app","redirectUri":"http://127.0.0.1:3000/account/callback","client":{"environmentId":"unified-local","authOrigin":"http://127.0.0.1:8787","productOrigin":"http://127.0.0.1:3000","clientId":"molis-club-unified-local","policyProfile":"unified-account-v2","redirectAllowlist":["http://127.0.0.1:3000/account/callback"],"environmentKind":"LOCAL","deliveryMode":"MOCK","providerMode":"MOCK"}}
        run: npm run build:cloudflare
      # Build output stays on the ephemeral runner. No upload/deploy step,
      # remote database operation, production bindings or production secrets.
      - uses: ./.claude/auth-ci/.github/actions/account-fixture
        with:
          source: .claude/auth-ci
      - name: Login regression against real Auth WASM
        run: MOLIS_AUTH_SOURCE="$GITHUB_WORKSPACE/.claude/auth-ci" node scripts/test-account-live-login.mjs

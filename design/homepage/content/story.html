<html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>众生卷 · 阅读示例 · 烤个梨呀</title><link rel="stylesheet" href="content.css"/></head>
<body><header class="content-header"><a href="../"><strong>烤个梨呀</strong></a><span>互动故事阅读示例</span></header><main class="content-shell"><span class="content-tag">小说 / 互动故事 · 示例内容</span><h1>众生卷</h1><p class="content-lead">故事作品拥有章节、阅读进度和讨论入口，不必以软件产品的方式被打开。</p><div class="content-meta"><span>虚构阅读片段</span><span>用于高保真交互演示</span><span>不代表正式故事内容</span></div><div class="content-body"><article class="reading-page"><p>城里的炉火熄得很早。她把那张没有寄出的纸折成四折，夹进一本谁也没有读完的书里。</p><p>第二天，窗外多了一条从未出现过的小路。路口没有名字，只有一只木牌，上面写着：如果愿意，可以从别人的选择里走一段。</p><p>她站了很久，然后推开门。故事没有告诉她哪条路是对的，只把每一种可能都留在了风里。</p></article><div class="chapter-list"><a href="#"><small>第一章</small><strong>没有寄出的纸</strong><span>当前示例</span></a><a href="#"><small>第二章</small><strong>路口没有名字</strong><span>目录示意</span></a><a href="../../site/pages/forum.html"><small>讨论</small><strong>你会替她选择哪条路？</strong><span>去围炉聊聊 ↗</span></a></div><a class="back-home" href="../">← 回到正在发生</a></div></main></body></html>
